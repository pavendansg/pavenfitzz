<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Macros</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.result-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 70% 60% at 20% 30%,rgba(200,245,66,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(200,245,66,0.04) 0%,transparent 55%),#080808;}
.result-card{width:100%;max-width:480px;background:#111110;border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:36px 28px;animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.step-top{text-align:center;margin-bottom:24px}
.step-icon{font-size:32px;margin-bottom:10px}
.step-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#f0ede6;margin-bottom:4px}
.step-sub{font-size:12px;color:#6b6b5a;font-family:'DM Sans',sans-serif}
.prog-dots{display:flex;justify-content:center;gap:6px;margin-bottom:24px}
.prog-dot{width:32px;height:4px;border-radius:2px;background:rgba(255,255,255,0.08)}
.prog-dot.active{background:#c8f542}
.goal-badge{display:inline-block;font-size:13px;font-weight:700;padding:5px 18px;border-radius:50px;background:rgba(200,245,66,0.1);border:1px solid rgba(200,245,66,0.25);color:#c8f542;font-family:'DM Sans',sans-serif;margin-bottom:20px}
.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.macro-card{background:#161615;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px 10px;text-align:center}
.macro-card.protein{border-color:rgba(240,100,100,0.25)}
.macro-card.carbs{border-color:rgba(69,146,240,0.25)}
.macro-card.fats{border-color:rgba(200,245,66,0.25)}
.macro-icon{font-size:22px;margin-bottom:8px}
.macro-big{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:4px}
.macro-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#6b6b5a;font-family:'DM Sans',sans-serif}
.macro-kcal{font-size:10px;color:#3a3a30;margin-top:2px;font-family:'DM Sans',sans-serif}
.macro-bar-wrap{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,0.05);margin-bottom:6px}
.macro-bar-p{background:#f06464}
.macro-bar-c{background:#4592f0}
.macro-bar-f{background:#c8f542}
.macro-legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:#6b6b5a;font-family:'DM Sans',sans-serif;margin-bottom:16px}
.legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.diet-section{background:#161615;border:1px solid rgba(255,255,255,0.05);border-radius:14px;padding:16px;margin-bottom:16px}
.diet-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#c8f542;margin-bottom:12px}
.diet-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;color:rgba(240,237,230,0.75);font-family:'DM Sans',sans-serif}
.diet-item:last-child{border-bottom:none}
.diet-icon{font-size:16px;flex-shrink:0}
.next-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#c8f542;color:#080808;font-size:15px;font-weight:800;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;margin-bottom:8px}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(200,245,66,0.28)}
.back-btn{width:100%;padding:12px;border:1px solid rgba(255,255,255,0.06);border-radius:12px;background:transparent;color:#6b6b5a;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
.back-btn:hover{color:#f0ede6;border-color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<div class="result-wrap">
  <div class="result-card">
    <div class="step-top">
      <div class="step-icon">🍗</div>
      <div class="step-title">Your Macros</div>
      <div class="step-sub">Step 3 of 3 — Personalized Nutrition</div>
    </div>
    <div class="prog-dots">
      <div class="prog-dot active"></div>
      <div class="prog-dot active"></div>
      <div class="prog-dot active"></div>
    </div>
    <div style="text-align:center"><div class="goal-badge" id="goalBadge"></div></div>

    <div class="macro-grid">
      <div class="macro-card protein">
        <div class="macro-icon">🍗</div>
        <div class="macro-big" style="color:#f06464" id="protVal">—</div>
        <div class="macro-label">Protein</div>
        <div class="macro-kcal" id="protKcal"></div>
      </div>
      <div class="macro-card carbs">
        <div class="macro-icon">🍚</div>
        <div class="macro-big" style="color:#4592f0" id="carbVal">—</div>
        <div class="macro-label">Carbs</div>
        <div class="macro-kcal" id="carbKcal"></div>
      </div>
      <div class="macro-card fats">
        <div class="macro-icon">🥑</div>
        <div class="macro-big" style="color:#c8f542" id="fatVal">—</div>
        <div class="macro-label">Fats</div>
        <div class="macro-kcal" id="fatKcal"></div>
      </div>
    </div>

    <div class="macro-bar-wrap">
      <div class="macro-bar-p" id="pBar" style="width:0%"></div>
      <div class="macro-bar-c" id="cBar" style="width:0%"></div>
      <div class="macro-bar-f" id="fBar" style="width:0%"></div>
    </div>
    <div class="macro-legend">
      <span><span class="legend-dot" style="background:#f06464"></span>Protein</span>
      <span><span class="legend-dot" style="background:#4592f0"></span>Carbs</span>
      <span><span class="legend-dot" style="background:#c8f542"></span>Fats</span>
    </div>

    <div class="diet-section">
      <div class="diet-title">🥗 Sample Diet Plan</div>
      <div id="dietItems"></div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="goNext()">Go to Your Progress 📈</button>
    <button class="back-btn" onclick="location.href='result-calories.html'">← Back to Calories</button>
  </div>
</div>
<script>
if(!localStorage.getItem("setup_done")){location.href="setup.html";}
const goal=localStorage.getItem("goal")||"maintain";
const protein=+localStorage.getItem("protein")||0;
const carbs=+localStorage.getItem("carbs")||0;
const fats=+localStorage.getItem("fats")||0;

const goalLabels={bulk:"💪 Bulking",maintain:"⚖️ Maintaining",cut:"🔥 Cutting"};
document.getElementById("goalBadge").innerText=goalLabels[goal]||goal;

document.getElementById("protVal").innerText=protein+"g";
document.getElementById("carbVal").innerText=carbs+"g";
document.getElementById("fatVal").innerText=fats+"g";
document.getElementById("protKcal").innerText=(protein*4)+" kcal";
document.getElementById("carbKcal").innerText=(carbs*4)+" kcal";
document.getElementById("fatKcal").innerText=(fats*9)+" kcal";

const total=(protein*4)+(carbs*4)+(fats*9)||1;
const pPct=Math.round((protein*4)/total*100);
const cPct=Math.round((carbs*4)/total*100);
const fPct=100-pPct-cPct;
document.getElementById("pBar").style.width=pPct+"%";
document.getElementById("cBar").style.width=cPct+"%";
document.getElementById("fBar").style.width=fPct+"%";

const plans={
  bulk:[{icon:"🌅",t:"Breakfast: Eggs + Oats + Milk"},{icon:"🍱",t:"Lunch: Rice + Chicken + Dal"},{icon:"🍌",t:"Snack: Banana + Peanut Butter"},{icon:"🌙",t:"Dinner: Rice + Paneer / Eggs"},{icon:"💊",t:"Post-workout: Whey Protein"}],
  maintain:[{icon:"🌅",t:"Breakfast: Oats + Fruits + Eggs"},{icon:"🍱",t:"Lunch: Rice + Chicken + Veggies"},{icon:"🍎",t:"Snack: Fruits + Mixed Nuts"},{icon:"🌙",t:"Dinner: Light meal + Salad"}],
  cut:[{icon:"🌅",t:"Breakfast: Egg whites + Oats"},{icon:"🍱",t:"Lunch: Chicken + Salad (no rice)"},{icon:"🥗",t:"Snack: Cucumber + Greek Yogurt"},{icon:"🌙",t:"Dinner: Lean protein + Veggies"}]
};
document.getElementById("dietItems").innerHTML=(plans[goal]||plans.maintain).map(i=>`<div class="diet-item"><span class="diet-icon">${i.icon}</span><span>${i.t}</span></div>`).join("");

function goNext(){
  // save daily entry to firebase
  location.href="graph.html";
}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",authDomain:"evolvefit-07.firebaseapp.com",projectId:"evolvefit-07"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
onAuthStateChanged(auth,async u=>{
  if(!u){location.href="login.html";return;}
  // save today's check-in
  const today=new Date().toISOString().split("T")[0];
  await setDoc(doc(db,"users",u.uid,"daily",today),{
    bmi:+localStorage.getItem("bmi"),
    weight:+localStorage.getItem("weight"),
    calories:+localStorage.getItem("calories"),
    goal:localStorage.getItem("goal"),
    date:today
  });
});
</script>
</body>
</html>
