<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Macros</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.step-top{text-align:center;margin-bottom:24px}
.step-sub{font-size:12px;color:var(--muted);margin-top:4px}
.goal-badge{display:inline-block;font-size:13px;font-weight:700;padding:5px 18px;border-radius:var(--r-full);background:rgba(200,245,66,0.1);border:1px solid rgba(200,245,66,0.25);color:var(--accent);margin-bottom:20px;backdrop-filter:var(--glass-blur-sm)}
.macro-bar-wrap{display:flex;height:6px;border-radius:var(--r-full);overflow:hidden;background:rgba(255,255,255,0.05);margin-bottom:6px}
.macro-bar-p{background:#f06464}
.macro-bar-c{background:#4592f0}
.macro-bar-f{background:#c8f542}
.macro-legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--muted);margin-bottom:16px}
.legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.diet-section{background:var(--glass);backdrop-filter:var(--glass-blur-sm);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
.diet-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px}
.diet-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border);font-size:13px;color:rgba(240,237,230,0.75)}
.diet-item:last-child{border-bottom:none}
.diet-icon{font-size:16px;flex-shrink:0}
</style>
</head>
<body class="fade-in">
  <div class="mesh-blob mesh-blob-1"></div>
<div class="mesh-blob mesh-blob-2"></div>
<div class="mesh-blob mesh-blob-3"></div>
<div class="mesh-blob mesh-blob-4"></div>
<div id="pageTransition" class="exit"></div>

<div class="container">
  <div class="card">
    <div class="step-top">
      <div class="logo-wrap"><span style="font-size:24px">🍗</span></div>
      <h1 class="slide-up stagger-1">Your Macros</h1>
      <p class="step-sub slide-up stagger-1">Step 3 of 3 — Personalized Nutrition</p>
      <div class="step-indicator slide-up stagger-2">
        <div class="step-dot done"></div>
        <div class="step-dot done"></div>
        <div class="step-dot done"></div>
      </div>
    </div>

    <div style="text-align:center" class="slide-up stagger-2"><div class="goal-badge" id="goalBadge"></div></div>

    <div class="macro-grid slide-up stagger-3">
      <div class="macro-card protein-card">
        <div class="macro-icon">🍗</div>
        <div class="macro-val" style="color:#f06464" id="protVal">—</div>
        <div class="macro-label">Protein</div>
        <div style="font-size:10px;color:var(--dim);margin-top:2px" id="protKcal"></div>
      </div>
      <div class="macro-card carbs-card">
        <div class="macro-icon">🍚</div>
        <div class="macro-val" style="color:#4592f0" id="carbVal">—</div>
        <div class="macro-label">Carbs</div>
        <div style="font-size:10px;color:var(--dim);margin-top:2px" id="carbKcal"></div>
      </div>
      <div class="macro-card fats-card">
        <div class="macro-icon">🥑</div>
        <div class="macro-val" style="color:#c8f542" id="fatVal">—</div>
        <div class="macro-label">Fats</div>
        <div style="font-size:10px;color:var(--dim);margin-top:2px" id="fatKcal"></div>
      </div>
    </div>

    <div class="slide-up stagger-3">
      <div class="macro-bar-wrap">
        <div class="macro-bar-p" id="pBar" style="width:0%"></div>
        <div class="macro-bar-c" id="cBar" style="width:0%"></div>
        <div class="macro-bar-f" id="fBar" style="width:0%"></div>
      </div>
      <div class="macro-legend">
        <span><span class="legend-dot" style="background:#f06464"></span>Protein</span>
        <span><span class="legend-dot" style="background:#4592f0"></span>Carbs</span>
        <span><span class="legend-dot" style="background:#c8f542"></span>Fats</span>
      </div>
    </div>

    <div class="diet-section slide-up stagger-4">
      <div class="diet-title">🥗 Sample Diet Plan</div>
      <div id="dietItems"></div>
    </div>

    <div class="slide-up stagger-5">
      <button class="primary-btn" id="nextBtn" onclick="goNext()">Go to Your Progress 📈</button>
      <button class="secondary-btn" style="margin-top:8px" onclick="goBack()">← Back to Calories</button>
    </div>
  </div>
</div>

<script>
if(!localStorage.getItem("setup_done")){location.href="setup.html";}
const goal=localStorage.getItem("goal")||"maintain";
const protein=+localStorage.getItem("protein")||0;
const carbs=+localStorage.getItem("carbs")||0;
const fats=+localStorage.getItem("fats")||0;

const goalLabels={bulk:"💪 Bulking",maintain:"⚖️ Maintaining",cut:"🔥 Cutting"};
document.getElementById("goalBadge").innerText=goalLabels[goal]||goal;

document.getElementById("protVal").innerText=protein+"g";
document.getElementById("carbVal").innerText=carbs+"g";
document.getElementById("fatVal").innerText=fats+"g";
document.getElementById("protKcal").innerText=(protein*4)+" kcal";
document.getElementById("carbKcal").innerText=(carbs*4)+" kcal";
document.getElementById("fatKcal").innerText=(fats*9)+" kcal";

const total=(protein*4)+(carbs*4)+(fats*9)||1;
const pPct=Math.round((protein*4)/total*100);
const cPct=Math.round((carbs*4)/total*100);
const fPct=100-pPct-cPct;
setTimeout(()=>{
  document.getElementById("pBar").style.width=pPct+"%";
  document.getElementById("cBar").style.width=cPct+"%";
  document.getElementById("fBar").style.width=fPct+"%";
},400);

const plans={
  bulk:[{icon:"🌅",t:"Breakfast: Eggs + Oats + Milk"},{icon:"🍱",t:"Lunch: Rice + Chicken + Dal"},{icon:"🍌",t:"Snack: Banana + Peanut Butter"},{icon:"🌙",t:"Dinner: Rice + Paneer / Eggs"},{icon:"💊",t:"Post-workout: Whey Protein"}],
  maintain:[{icon:"🌅",t:"Breakfast: Oats + Fruits + Eggs"},{icon:"🍱",t:"Lunch: Rice + Chicken + Veggies"},{icon:"🍎",t:"Snack: Fruits + Mixed Nuts"},{icon:"🌙",t:"Dinner: Light meal + Salad"}],
  cut:[{icon:"🌅",t:"Breakfast: Egg whites + Oats"},{icon:"🍱",t:"Lunch: Chicken + Salad (no rice)"},{icon:"🥗",t:"Snack: Cucumber + Greek Yogurt"},{icon:"🌙",t:"Dinner: Lean protein + Veggies"}]
};
document.getElementById("dietItems").innerHTML=(plans[goal]||plans.maintain).map(i=>`<div class="diet-item"><span class="diet-icon">${i.icon}</span><span>${i.t}</span></div>`).join("");

localStorage.setItem("macros_done","true");

window.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>{document.getElementById("pageTransition").classList.add("exit");},50);
});
function goBack(){
  const t=document.getElementById("pageTransition");
  t.classList.remove("exit");t.classList.add("enter");
  setTimeout(()=>{location.href="result-calories.html";},480);
}
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",authDomain:"evolvefit-07.firebaseapp.com",projectId:"evolvefit-07"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
let currentUser=null;

onAuthStateChanged(auth,u=>{
  if(!u){location.href="login.html";return;}
  currentUser=u;
});

// ✅ Save to Firestore on click, with page transition, then go to graph
window.goNext=async function(){
  const btn=document.getElementById("nextBtn");
  btn.disabled=true;
  btn.innerText="Saving...";

  if(currentUser){
    try{
      const today=new Date().toISOString().split("T")[0];
      await setDoc(doc(db,"users",currentUser.uid,"daily",today),{
        bmi:+localStorage.getItem("bmi"),
        weight:+localStorage.getItem("weight"),
        calories:+localStorage.getItem("calories"),
        protein:+localStorage.getItem("protein"),
        carbs:+localStorage.getItem("carbs"),
        fats:+localStorage.getItem("fats"),
        goal:localStorage.getItem("goal"),
        date:today
      });
    }catch(e){ console.error("Save failed:",e); }
  }

  const t=document.getElementById("pageTransition");
  t.classList.remove("exit");t.classList.add("enter");
  setTimeout(()=>{location.href="graph.html";},480);
};
</script>
</body>
</html>
