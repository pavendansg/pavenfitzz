<!DOCTYPE html>
<html>
<head>
    <title>PAVENFITZ</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="hero desktop">
    <div class="bg-overlay"></div>

    <div class="hero-left">
        <button class="join-btn" onclick="goApp()">
            Join Now
        </button>
    </div>
</div>

<div class="mobile-hero">
    <h1>EvolveFit Club 💪</h1>
    <p>Transform Your Body</p>

    <button class="join-btn" onclick="goApp()">
        Join Now
    </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 SMART NAVIGATION
window.goApp = function(){
    if(auth.currentUser){
        window.location.href = "dashboard.html"; // already logged in
    } else {
        window.location.href = "login.html"; // not logged in
    }
};
</script>

</body>
</html>
