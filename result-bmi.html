<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Your BMI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.step-top{text-align:center;margin-bottom:24px}
.step-sub{font-size:12px;color:var(--muted);margin-top:4px}
.bmi-bar-wrap{margin:16px 0}
.bmi-bar-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px}
.bmi-bar{height:8px;border-radius:var(--r-full);background:linear-gradient(90deg,var(--blue),var(--accent),var(--gold),var(--red));position:relative;box-shadow:0 0 16px rgba(0,0,0,.3)}
.bmi-marker{position:absolute;top:-4px;width:16px;height:16px;background:var(--white);border-radius:50%;border:2.5px solid var(--bg);transform:translateX(-50%);transition:left 1s var(--spring);box-shadow:0 0 12px rgba(255,255,255,0.6);left:0%}
.bmi-range-nums{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-top:4px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.tip-box{background:rgba(240,192,64,0.06);backdrop-filter:var(--glass-blur-sm);border:1px solid rgba(240,192,64,0.15);border-radius:var(--r-md);padding:13px 15px;font-size:12px;color:#bcae84;line-height:1.9;white-space:pre-line;margin-bottom:16px}
</style>
</head>
<body class="fade-in">
<div id="pageTransition" class="exit"></div>

<div class="container">
  <div class="card">
    <div class="step-top">
      <div class="logo-wrap"><span style="font-size:24px">📊</span></div>
      <h1 class="slide-up stagger-1">Your BMI Result</h1>
      <p class="step-sub slide-up stagger-1">Step 1 of 3 — Body Mass Index</p>
      <div class="step-indicator slide-up stagger-2">
        <div class="step-dot done"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>
    </div>

    <div class="bmi-result-card slide-up stagger-2">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);margin-bottom:8px">Your BMI</div>
      <div class="bmi-result-val" id="bmiVal">—</div>
      <div class="bmi-result-tag" id="bmiTag">—</div>
      <div class="bmi-bar-wrap">
        <div class="bmi-bar-labels"><span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span></div>
        <div class="bmi-bar"><div class="bmi-marker" id="bmiMarker"></div></div>
        <div class="bmi-range-nums"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
      </div>
    </div>

    <div class="info-grid slide-up stagger-3">
      <div class="stat-box"><div class="stat-tile-label">Healthy Range</div><div class="stat-tile-val" style="font-size:14px">18.5–24.9</div></div>
      <div class="stat-box"><div class="stat-tile-label">Ideal Weight</div><div class="stat-tile-val" style="font-size:14px" id="idealVal">—</div></div>
      <div class="stat-box"><div class="stat-tile-label">Your Weight</div><div class="stat-tile-val" style="font-size:14px" id="weightVal">—</div></div>
      <div class="stat-box"><div class="stat-tile-label">Goal</div><div class="stat-tile-val" style="font-size:14px" id="goalVal">—</div></div>
    </div>

    <div class="tip-box slide-up stagger-4" id="tipBox"></div>

    <div class="slide-up stagger-5">
      <button class="primary-btn" onclick="goNext()">Next → Calorie Target ⚡</button>
      <button class="secondary-btn" style="margin-top:8px" onclick="goBack()">← Edit Details</button>
    </div>
  </div>
</div>

<script>
if(!localStorage.getItem("setup_done")){location.href="setup.html";}
const bmi=parseFloat(localStorage.getItem("bmi")||0);
const weight=localStorage.getItem("weight")||"—";
const idealMin=localStorage.getItem("idealMin")||"—";
const idealMax=localStorage.getItem("idealMax")||"—";
const goal=localStorage.getItem("goal")||"maintain";

document.getElementById("bmiVal").innerText=bmi;
document.getElementById("weightVal").innerText=weight+"kg";
document.getElementById("idealVal").innerText=idealMin+"–"+idealMax+"kg";
document.getElementById("goalVal").innerText=goal.toUpperCase();

let tag,color,tip;
if(bmi<18.5){tag="Underweight";color="#4592f0";tip="🍗 Focus on calorie surplus\n🏋️ Heavy compound lifts\n🥚 High protein diet";}
else if(bmi<25){tag="Healthy ✅";color="#c8f542";tip="⚖️ Balanced diet\n🏃 Mixed cardio & weights\n💧 Stay hydrated";}
else if(bmi<30){tag="Overweight";color="#f0c040";tip="🥗 Calorie deficit diet\n🔥 HIIT cardio\n🚫 Limit processed food";}
else{tag="Obese";color="#f04545";tip="🥗 Strict calorie deficit\n🔥 Daily cardio\n👨‍⚕️ Consider a professional";}

const tagEl=document.getElementById("bmiTag");
tagEl.innerText=tag;
tagEl.style.background=color+"18";
tagEl.style.color=color;
tagEl.style.border="1px solid "+color+"40";
document.getElementById("tipBox").innerText=tip;

const pct=Math.min(100,Math.max(0,((bmi-15)/(40-15))*100));
setTimeout(()=>{document.getElementById("bmiMarker").style.left=pct+"%";},800);

localStorage.setItem("bmi_done","true");

window.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>{document.getElementById("pageTransition").classList.add("exit");},50);
});
function goNext(){
  const t=document.getElementById("pageTransition");
  t.classList.remove("exit");t.classList.add("enter");
  setTimeout(()=>{location.href="result-calories.html";},480);
}
function goBack(){
  const t=document.getElementById("pageTransition");
  t.classList.remove("exit");t.classList.add("enter");
  setTimeout(()=>{location.href="setup.html";},480);
}
</script>
</body>
</html>
