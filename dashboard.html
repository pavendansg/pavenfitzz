<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        /* 🔥 CARD GRID */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            background: #111;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }

        /* 🔥 PROGRESS BAR */
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right,#ffd700,#ffcc00);
            width: 0%;
        }

        .history {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
        }

        input {
            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🔥 Dashboard</h1>
<h3 id="user"></h3>

<!-- 🔥 STATS -->
<div class="stats">
    <div class="stat-box" id="bmi"></div>
    <div class="stat-box" id="calories"></div>
    <div class="stat-box" id="protein"></div>
    <div class="stat-box" id="carbs"></div>
    <div class="stat-box" id="fats"></div>
</div>

<!-- 🎯 GOAL PROGRESS -->
<h3 style="margin-top:20px;">🎯 Goal Progress</h3>
<div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
</div>
<p id="progressText"></p>

<!-- ➕ ADD WEIGHT -->
<h3 style="margin-top:20px;">➕ Update Today Weight</h3>
<input type="number" id="newWeight" placeholder="Enter today weight">
<button class="primary-btn" onclick="addWeight()">Save Weight</button>

<!-- 📊 GRAPH -->
<canvas id="chart"></canvas>

<!-- 📅 HISTORY -->
<div class="history" id="historyBox"></div>

<br>

<button class="primary-btn" onclick="goToBMI()">Update Full Data 🔄</button>
<button class="secondary-btn" onclick="logout()">Logout 🚪</button>

</div>
</div>

<script>

// 🔥 DATA
let name = localStorage.getItem("username");
let weight = Number(localStorage.getItem("weight"));
let height = Number(localStorage.getItem("height"));
let calories = Number(localStorage.getItem("calories"));
let goal = localStorage.getItem("goal");

// PROTECT
if(!name) window.location.href="login.html";

document.getElementById("user").innerText="🔥 "+name;

// BMI
let bmi = weight / ((height/100)*(height/100));
document.getElementById("bmi").innerText="BMI: "+bmi.toFixed(2);

// CALORIES
document.getElementById("calories").innerText="Calories: "+calories;

// MACROS
let protein=0,fats=0,carbs=0;

if(goal==="bulk"){ protein=weight*2; fats=weight*0.8; }
else if(goal==="maintain"){ protein=weight*1.8; fats=weight*0.7; }
else { protein=weight*2.2; fats=weight*0.6; }

let used=(protein*4)+(fats*9);
carbs=(calories-used)/4;

protein=Math.round(protein);
carbs=Math.round(carbs);
fats=Math.round(fats);

document.getElementById("protein").innerText="Protein: "+protein+"g";
document.getElementById("carbs").innerText="Carbs: "+carbs+"g";
document.getElementById("fats").innerText="Fats: "+fats+"g";

// 🎯 GOAL PROGRESS
let startWeight = Number(localStorage.getItem("startWeight")) || weight;
localStorage.setItem("startWeight", startWeight);

let progress = ((weight - startWeight) / startWeight) * 100;
progress = Math.max(0, progress);

document.getElementById("progressFill").style.width = progress + "%";
document.getElementById("progressText").innerText =
    "Progress: " + progress.toFixed(1) + "%";

// 📅 HISTORY
let history = JSON.parse(localStorage.getItem("history")) || [];
let today = new Date().toLocaleDateString();

// ADD IF NOT EXISTS
if(!history.some(h => h.date === today)){
    history.push({date: today, weight: weight, calories: calories});
    localStorage.setItem("history", JSON.stringify(history));
}

// ➕ ADD WEIGHT FUNCTION
function addWeight(){
    let newW = document.getElementById("newWeight").value;

    if(!newW){
        alert("Enter weight bro ⚠️");
        return;
    }

    newW = Number(newW);

    localStorage.setItem("weight", newW);

    history.push({
        date: today + " (updated)",
        weight: newW,
        calories: calories
    });

    localStorage.setItem("history", JSON.stringify(history));

    location.reload();
}

// 📊 GRAPH
new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
        labels: history.map(h=>h.date),
        datasets: [{
            label: "Weight 💪",
            data: history.map(h=>h.weight),
            borderWidth: 3,
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        animation: { duration: 1500 }
    }
});

// 📅 HISTORY UI
let box = document.getElementById("historyBox");
box.innerHTML="<b>📅 History:</b><br>";

history.slice().reverse().forEach(h=>{
    box.innerHTML += `${h.date} → ${h.weight}kg<br>`;
});

// NAV
function goToBMI(){ window.location.href="bmi.html"; }
function logout(){ localStorage.clear(); window.location.href="login.html"; }

</script>

</body>
</html>
