<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
<div class="card">

<!-- HEADER -->
<div class="top-bar">
    <img id="profilePic">
    <h2 id="user"></h2>
</div>

<h1 class="title">🔥 Dashboard</h1>
<p id="streak" class="streak"></p>

<!-- STATS -->
<div class="box">
    <p id="bmi"></p>
    <p id="weight"></p>
    <p id="journey"></p>
    <p id="calories"></p>
    <p id="goal"></p>
</div>

<!-- TARGET -->
<div class="box">
    <h3 id="targetText"></h3>
    <p id="goalStatus"></p>
</div>

<!-- PROGRESS -->
<div class="box">
    <p id="progressText"></p>

    <div class="progress">
        <div id="progressBar"></div>
    </div>
</div>

<!-- BUTTONS -->
<div class="btns">
    <button onclick="goToBMI()">Daily Check-In 📝</button>
    <button onclick="logout()">Logout 🚪</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
 authDomain: "evolvefit-07.firebaseapp.com",
 projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let name = localStorage.getItem("username") || "User";
let photo = localStorage.getItem("photo");

document.getElementById("user").innerText =
"🔥 Welcome, " + name + " 💪";

document.getElementById("profilePic").src = photo || "";

// AUTH
onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

const snap = await getDocs(collection(db,"users",user.uid,"daily"));

if(snap.empty){
location.href="bmi.html";
return;
}

let history = [];
snap.forEach(doc => history.push(doc.data()));

history.sort((a,b)=>
new Date(a.date)-new Date(b.date)
);

let first = history[0];
let latest = history[history.length-1];
let prev = history.length > 1
? history[history.length-2]
: latest;

// BMI
document.getElementById("bmi").innerText =
"BMI: " + latest.bmi;

// DAILY CHANGE
let diff = latest.weight - prev.weight;

let diffText =
diff==0 ? "— no change" :
diff>0 ? `⬆ +${diff} kg` :
`⬇ ${Math.abs(diff)} kg`;

document.getElementById("weight").innerText =
"Weight: " + latest.weight + " kg (" + diffText + ")";

// JOURNEY
let total = latest.weight - first.weight;

let totalText =
total==0 ? "No total change" :
total>0 ? `⬆ +${total} kg total` :
`⬇ ${Math.abs(total)} kg total`;

document.getElementById("journey").innerText =
"Journey: " + totalText;

// CALORIES
document.getElementById("calories").innerText =
"Calories: " + latest.calories + " kcal";

// GOAL
document.getElementById("goal").innerText =
"Goal: " + latest.goal;

// STREAK
let streak = 1;

for(let i=history.length-1;i>0;i--){

let d1 = new Date(history[i].date);
let d2 = new Date(history[i-1].date);

let days = (d1-d2)/(1000*60*60*24);

if(days===1) streak++;
else break;

}

document.getElementById("streak").innerText =
"🔥 Streak: " + streak + " days";

// TARGET
let target = Number(localStorage.getItem("targetWeight"));
if(!target) target = first.weight + 5;

document.getElementById("targetText").innerText =
"Target: " + target + " kg 🎯";

// PROGRESS
let start = first.weight;
let current = latest.weight;

let progress = 0;

if(latest.goal==="cut"){

let need = start - target;
let done = start - current;

if(need>0) progress = (done/need)*100;

}else{

let need = target - start;
let done = current - start;

if(need>0) progress = (done/need)*100;

}

if(!isFinite(progress)) progress = 0;

progress = Math.max(0,Math.min(100,Math.round(progress)));

document.getElementById("progressBar").style.width =
progress + "%";

document.getElementById("progressText").innerText =
"Goal Progress: " + progress + "% 🎯";

document.getElementById("goalStatus").innerText =
progress>=100
? "🏆 Target Achieved!"
: "Keep going beast mode 💪";

});

// NAV
window.goToBMI=()=>{
location.href="bmi.html";
}

window.logout=()=>{
localStorage.clear();
location.href="login.html";
}

</script>

</body>
</html>
