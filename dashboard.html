<!DOCTYPE html>

<html>
<head>
    <title>Dashboard - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
```

</head>

<body>

<div class="container">
    <div class="card">

```
    <h2 id="user"></h2>
    <h1>🔥 Dashboard</h1>

    <hr style="margin:15px 0; border:0.5px solid #333;">

    <h3 id="bmi"></h3>
    <h3 id="calories"></h3>

    <canvas id="chart" style="margin-top:20px;"></canvas>

    <div id="historyBox" style="margin-top:20px;"></div>

    <br>

    <button class="primary-btn" onclick="goToBMI()">Update Data 🔄</button>
    <button class="secondary-btn" onclick="logout()">Logout 🚪</button>

</div>
```

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔥 WAIT FOR PAGE LOAD
window.addEventListener("DOMContentLoaded", () => {

    // USER NAME
    let name = localStorage.getItem("username");
    let userEl = document.getElementById("user");
    if(userEl){
        userEl.innerText = "🔥 " + name;
    }

    // 🔥 WAIT FOR FIREBASE USER
    onAuthStateChanged(auth, async (user) => {

        if(!user){
            window.location.href = "login.html";
            return;
        }

        try {

            const q = query(
                collection(db, "users"),
                where("uid", "==", user.uid)
            );

            const querySnapshot = await getDocs(q);

            let bmiEl = document.getElementById("bmi");
            let calEl = document.getElementById("calories");

            if(querySnapshot.empty){
                if(bmiEl) bmiEl.innerText = "No data yet ❌";
                return;
            }

            let history = [];

            querySnapshot.forEach(doc => {
                history.push(doc.data());
            });

            // SORT LATEST FIRST
            history.sort((a,b) => new Date(b.date) - new Date(a.date));
            let latest = history[0];

            if(bmiEl) bmiEl.innerText = "BMI: " + latest.bmi;
            if(calEl) calEl.innerText = "Calories: " + latest.calories;

            // 📊 GRAPH
            if(typeof Chart !== "undefined"){
                new Chart(document.getElementById("chart"), {
                    type: "line",
                    data: {
                        labels: history.map(h => h.date),
                        datasets: [{
                            label: "BMI 📊",
                            data: history.map(h => h.bmi),
                            borderWidth: 3,
                            tension: 0.4
                        }]
                    }
                });
            }

            // 📅 HISTORY
            let box = document.getElementById("historyBox");
            if(box){
                box.innerHTML = "<b>📅 History:</b><br>";
                history.forEach(h => {
                    box.innerHTML += `${h.date} → BMI ${h.bmi}<br>`;
                });
            }

        } catch(err){
            console.error(err);
        }

    });

});

// NAVIGATION
window.goToBMI = function(){
    window.location.href = "bmi.html";
}

// LOGOUT
window.logout = function(){
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
