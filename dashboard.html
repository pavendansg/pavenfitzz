<!DOCTYPE html>

<html>
<head>
    <title>Dashboard - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
```

</head>

<body>

<div class="container">
<div class="card">

<h2 id="user"></h2>
<h1>🔥 Dashboard</h1>

<h3 id="streak"></h3>

<hr style="margin:15px 0; border:0.5px solid #333;">

<h3 id="bmi"></h3>
<h3 id="weight"></h3>
<h3 id="calories"></h3>
<h3 id="goal"></h3>

<!-- 🔥 WEEKLY REPORT -->

<h3 style="margin-top:20px;">📊 Weekly Report</h3>
<h4 id="weeklyBMI"></h4>
<h4 id="weeklyWeight"></h4>
<h4 id="weeklyCalories"></h4>

<canvas id="chart"></canvas>

<div id="historyBox"></div>

<br>

<button class="primary-btn" onclick="goToBMI()">Update Data 🔄</button> <button class="secondary-btn" onclick="logout()">Logout 🚪</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let name = localStorage.getItem("username") || "User";
if(name.includes("@")) name = name.split("@")[0];
name = name.charAt(0).toUpperCase() + name.slice(1);
document.getElementById("user").innerText = "🔥 Welcome, " + name + " 💪";

onAuthStateChanged(auth, async (user) => {

if(!user){
    window.location.href = "login.html";
    return;
}

const snapshot = await getDocs(collection(db,"users",user.uid,"daily"));

if(snapshot.empty){
    document.getElementById("bmi").innerText = "No data yet ❌";
    document.getElementById("streak").innerText = "🔥 Streak: 0 days";
    return;
}

let history = [];

snapshot.forEach(doc=>{
    history.push(doc.data());
});

// SORT
history.sort((a,b)=> new Date(a.date)-new Date(b.date));

// FALLBACK WEIGHT
let currentWeight = localStorage.getItem("weight") || 0;

history = history.map(h => ({
    ...h,
    weight: h.weight || currentWeight
}));

// LAST 5 DAYS
let last5 = history.slice(-5);
let latest = last5[last5.length-1];

// SHOW BMI
document.getElementById("bmi").innerText = "BMI: " + latest.bmi;

// WEIGHT CHANGE
let prev = last5.length > 1 ? last5[last5.length-2].weight : latest.weight;
let diff = latest.weight - prev;

let trendText = "";
let color = "";

if(diff > 0){
    trendText = "📈 +" + diff + "kg";
    color = "lightgreen";
}
else if(diff < 0){
    trendText = "📉 " + diff + "kg";
    color = "red";
}
else{
    trendText = "➖ no change";
    color = "gray";
}

document.getElementById("weight").innerHTML =
`Weight: ${latest.weight} kg <span style="color:${color}">(${trendText})</span>`;

document.getElementById("calories").innerText = "Calories: " + latest.calories + " kcal";
document.getElementById("goal").innerText = "Goal: " + latest.goal;

// 🔥 STREAK
let dates = history.map(h=>new Date(h.date)).sort((a,b)=>b-a);
let streak = 1;

for(let i=0;i<dates.length-1;i++){
    let diff=(dates[i]-dates[i+1])/(1000*60*60*24);
    if(diff===1) streak++;
    else break;
}

let fire = "🔥".repeat(Math.min(streak,5));
document.getElementById("streak").innerText =
fire + " Streak: " + streak + (streak===1 ? " day" : " days");

// 🔥 WEEKLY REPORT (LAST 7 DAYS)
let last7 = history.slice(-7);

if(last7.length > 0){

    let avgBMI = last7.reduce((sum,h)=> sum + Number(h.bmi),0) / last7.length;
    avgBMI = avgBMI.toFixed(2);

    let firstWeight = last7[0].weight;
    let lastWeight = last7[last7.length-1].weight;
    let weightDiff = (lastWeight - firstWeight).toFixed(2);

    let weightTrend =
        weightDiff > 0 ? "📈 +" + weightDiff + "kg" :
        weightDiff < 0 ? "📉 " + weightDiff + "kg" :
        "➖ no change";

    let avgCalories = Math.round(
        last7.reduce((sum,h)=> sum + Number(h.calories),0) / last7.length
    );

    document.getElementById("weeklyBMI").innerText =
        "Avg BMI (7 days): " + avgBMI;

    document.getElementById("weeklyWeight").innerText =
        "Weight Change: " + weightTrend;

    document.getElementById("weeklyCalories").innerText =
        "Avg Calories: " + avgCalories + " kcal";
}

// GRAPH
new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
        labels:last5.map(h=>h.date),
        datasets:[
        {
            label:"BMI 📊",
            data:last5.map(h=>h.bmi),
            borderWidth:3
        },
        {
            label:"Weight ⚖️",
            data:last5.map(h=>h.weight),
            borderWidth:3
        }
        ]
    }
});

// HISTORY
let box=document.getElementById("historyBox");
box.innerHTML="<b>📅 Last 5 Days:</b><br>";

last5.slice().reverse().forEach(h=>{
    box.innerHTML+=`${h.date} → BMI ${h.bmi} | ${h.weight}kg<br>`;
});

});

// NAV
window.goToBMI=()=>window.location.href="bmi.html";

// LOGOUT
window.logout=()=>{
localStorage.clear();
window.location.href="login.html";
};

</script>

</body>
</html>
