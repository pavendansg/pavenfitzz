<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
<div class="card">

<!-- HEADER -->
<div class="top-bar">
    <img id="profilePic">
    <div>
        <p style="opacity:.7;font-size:14px;">Welcome back</p>
        <h2 id="user"></h2>
    </div>
</div>

<h1 class="title">🔥 Dashboard</h1>
<p id="streak" class="streak"></p>
<p id="rank" style="color:#ffd700;font-weight:700;margin-top:-8px;margin-bottom:16px;"></p>

<!-- STATUS -->
<div class="box">
    <p id="checkinStatus"></p>
</div>

<!-- ACHIEVEMENTS -->
<div class="box">
    <h3 style="color:#ffd700;margin-bottom:10px;">🏅 Achievements</h3>
    <p id="badges"></p>
</div>

<!-- DAILY MISSIONS -->
<div class="box">
    <h3 style="color:#ffd700;margin-bottom:10px;">🎯 Daily Missions</h3>
    <p id="missions"></p>
</div>

<!-- STATS -->
<div class="box">
    <p id="bmi"></p>
    <p id="weight"></p>
    <p id="journey"></p>
    <p id="calories"></p>
    <p id="goal"></p>
</div>

<!-- TARGET -->
<div class="box">
    <h3 id="targetText"></h3>
    <p id="goalStatus"></p>
</div>

<!-- PROGRESS -->
<div class="box">
    <p id="progressText"></p>

    <div class="progress">
        <div id="progressBar"></div>
    </div>
</div>

<!-- QUOTE -->
<div class="box">
    <p style="color:#ffd700;font-weight:700;">
        Discipline beats motivation 🔥
    </p>
</div>

<!-- BUTTONS -->
<div class="btns">
    <button class="primary-btn" onclick="goToBMI()">Daily Check-In 📝</button>
    <button class="secondary-btn" onclick="openGraph()">View Progress 📈</button>
</div>

<div class="btns" style="margin-top:10px;">
    <button class="secondary-btn" onclick="logout()">Logout 🚪</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
 authDomain: "evolvefit-07.firebaseapp.com",
 projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let name = localStorage.getItem("username") || "User";
let photo = localStorage.getItem("photo");

document.getElementById("user").innerText = name + " 💪";
document.getElementById("profilePic").src = photo || "";

// AUTH
onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

const snap = await getDocs(collection(db,"users",user.uid,"daily"));

if(snap.empty){
location.href="bmi.html";
return;
}

let history = [];
snap.forEach(doc => history.push(doc.data()));

history.sort((a,b)=>
new Date(a.date)-new Date(b.date)
);

let first = history[0];
let latest = history[history.length-1];
let prev = history.length > 1 ? history[history.length-2] : latest;

// TODAY STATUS
let today = new Date().toISOString().split("T")[0];

document.getElementById("checkinStatus").innerText =
latest.date === today
? "🟢 Checked in today"
: "🔴 Pending today's check-in";

// BMI
document.getElementById("bmi").innerText =
"🔥 BMI: " + latest.bmi;

// DAILY CHANGE
let diff = latest.weight - prev.weight;

let diffText =
diff==0 ? "— no change" :
diff>0 ? `⬆ +${diff} kg` :
`⬇ ${Math.abs(diff)} kg`;

document.getElementById("weight").innerText =
"⚖️ Weight: " + latest.weight + " kg (" + diffText + ")";

// JOURNEY
let total = latest.weight - first.weight;

let totalText =
total==0 ? "No total change" :
total>0 ? `⬆ +${total} kg total` :
`⬇ ${Math.abs(total)} kg total`;

document.getElementById("journey").innerText =
"📈 Journey: " + totalText;

// CALORIES
document.getElementById("calories").innerText =
"🍗 Calories: " + latest.calories + " kcal";

// GOAL
document.getElementById("goal").innerText =
"🎯 Goal: " + latest.goal;

// STREAK
let streak = 1;

for(let i=history.length-1;i>0;i--){

let d1 = new Date(history[i].date);
let d2 = new Date(history[i-1].date);

let days = (d1-d2)/(1000*60*60*24);

if(days===1) streak++;
else break;

}

document.getElementById("streak").innerText =
"🔥 Streak: " + streak + " days";

// RANK SYSTEM
let rank = "";
let next = 0;

if(streak <= 3){
rank = "🥉 Beginner";
next = 4 - streak;
}
else if(streak <= 7){
rank = "🛡️ Warrior";
next = 8 - streak;
}
else if(streak <= 14){
rank = "🐺 Beast";
next = 15 - streak;
}
else if(streak <= 30){
rank = "👑 Elite";
next = 31 - streak;
}
else{
rank = "⚡ Legend";
next = 0;
}

document.getElementById("rank").innerText =
next > 0
? "Rank: " + rank + " | Next rank in " + next + " day(s)"
: "Rank: " + rank;

// ACHIEVEMENTS
let badges = [];

badges.push("🎉 First Check-In");

if(streak >= 3) badges.push("🔥 3 Day Streak");
if(streak >= 7) badges.push("🛡️ 7 Day Warrior");
if(streak >= 14) badges.push("🐺 14 Day Beast");
if(streak >= 30) badges.push("👑 30 Day Elite");

if(Math.abs(total) >= 1) badges.push("💪 1kg Progress");

document.getElementById("badges").innerHTML =
badges.join("<br>");

// DAILY MISSIONS
let missions = [];

missions.push(latest.date === today ? "✅ Checked in today" : "⬜ Check in weight");

if(latest.goal === "bulk"){
missions.push("⬜ Hit calorie surplus 🍗");
missions.push("⬜ Strength workout 💪");
missions.push("⬜ Protein goal reached 🥚");
}
else if(latest.goal === "cut"){
missions.push("⬜ Stay calorie deficit 🔥");
missions.push("⬜ Cardio / walk today 🚶");
missions.push("⬜ Drink 3L water 💧");
}
else{
missions.push("⬜ Maintain calories ⚖️");
missions.push("⬜ Workout today 💪");
missions.push("⬜ Sleep 8 hours 😴");
}

document.getElementById("missions").innerHTML =
missions.join("<br>");

// TARGET
let target = Number(localStorage.getItem("targetWeight"));
if(!target) target = first.weight + 5;

document.getElementById("targetText").innerText =
"Target: " + target + " kg 🎯";

// PROGRESS
let start = first.weight;
let current = latest.weight;

let progress = 0;

if(latest.goal==="cut"){

let need = start - target;
let done = start - current;

if(need>0) progress = (done/need)*100;

}else{

let need = target - start;
let done = current - start;

if(need>0) progress = (done/need)*100;

}

if(!isFinite(progress)) progress = 0;

progress = Math.max(0,Math.min(100,Math.round(progress)));

document.getElementById("progressBar").style.width =
progress + "%";

document.getElementById("progressText").innerText =
"Goal Progress: " + progress + "% 🎯";

document.getElementById("goalStatus").innerText =
progress>=100
? "🏆 Target Achieved!"
: "Keep going beast mode 💪";

});

// NAV
window.goToBMI=()=>{
location.href="bmi.html";
}

window.openGraph=()=>{
location.href="graph.html";
}

window.logout=()=>{
localStorage.clear();
location.href="login.html";
}

</script>

</body>
</html>
