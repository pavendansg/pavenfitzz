<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
<div class="card">

<div style="display:flex; align-items:center; gap:10px;">
    <img id="profilePic" style="width:45px;height:45px;border-radius:50%;border:2px solid limegreen;">
    <h2 id="user"></h2>
</div>

<h1>🔥 Dashboard</h1>
<h3 id="streak"></h3>

<hr>

<h3 id="bmi"></h3>
<h3 id="weight"></h3>
<h3 id="calories"></h3>
<h3 id="goal"></h3>

<input type="number" id="targetInput" placeholder="Set target weight (kg)">
<button onclick="saveTarget()">Set 🎯</button>

<h4 id="targetText"></h4>
<h4 id="goalStatus"></h4>

<h4 id="progressText"></h4>
<div style="background:#333;height:15px;border-radius:10px;">
    <div id="progressBar" style="height:100%;width:0%;background:limegreen;"></div>
</div>

<button onclick="goToBMI()">Update 🔄</button>
<button onclick="logout()">Logout 🚪</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let name = localStorage.getItem("username") || "User";
let photo = localStorage.getItem("photo");

document.getElementById("user").innerText = "🔥 Welcome, " + name + " 💪";
document.getElementById("profilePic").src = photo || "";

// SAVE TARGET
window.saveTarget = function(){
    let target = Number(document.getElementById("targetInput").value);
    if(!target) return alert("Enter target");

    let progress = document.getElementById("progressText").innerText;

    if(progress && !progress.includes("100")){
        alert("Finish current goal first 💪");
        return;
    }

    localStorage.setItem("targetWeight", target);
    location.reload();
};

// 🔥 CLEAN AUTH (NO REDIRECT LOOP)
onAuthStateChanged(auth, async (user) => {

    if(!user){
        console.log("Waiting for login...");
        return; // ❌ NO redirect here
    }

    const snap = await getDocs(collection(db,"users",user.uid,"daily"));

    if(snap.empty){
        document.getElementById("bmi").innerText="No data ❌";
        document.getElementById("streak").innerText="🔥 Streak: 0 days";
        return;
    }

    let history=[];
    snap.forEach(d=>history.push(d.data()));

    history.sort((a,b)=> new Date(a.date)-new Date(b.date));

    let latest=history[history.length-1];

    // DATA
    document.getElementById("bmi").innerText="BMI: "+latest.bmi;

    let prev = history.length > 1 ? history[history.length-2].weight : latest.weight;
    let diff = latest.weight - prev;

    let changeText = diff === 0 
      ? "— no change" 
      : diff > 0 
        ? `⬆ +${diff} kg` 
        : `⬇ ${diff} kg`;

    document.getElementById("weight").innerText =
    "Weight: " + latest.weight + " kg (" + changeText + ")";

    document.getElementById("calories").innerText="Calories: "+latest.calories+" kcal";
    document.getElementById("goal").innerText="Goal: "+latest.goal;

    // STREAK
    let streak = 1;

    for(let i = history.length - 1; i > 0; i--){
        let d1 = new Date(history[i].date);
        let d2 = new Date(history[i-1].date);

        let diff = (d1 - d2) / (1000 * 60 * 60 * 24);

        if(diff === 1){
            streak++;
        } else break;
    }

    document.getElementById("streak").innerText =
    "🔥 Streak: " + streak + " days";

    // PROGRESS
    let start=history[0].weight;
    let current=latest.weight;

    let target=Number(localStorage.getItem("targetWeight"))||start+5;

    document.getElementById("targetText").innerText="Target: "+target+" kg 🎯";

    let progress;

    if(latest.goal === "cut"){
        progress = ((start - current) / (start - target)) * 100;
    } else {
        progress = ((current - start) / (target - start)) * 100;
    }

    if(!isFinite(progress)) progress=0;

    progress=Math.max(0,Math.min(100,Math.round(progress)));

    document.getElementById("progressBar").style.width=progress+"%";
    document.getElementById("progressText").innerText="Goal Progress: "+progress+"% 🎯";

    document.getElementById("goalStatus").innerText =
    progress>=100 ? "🏆 Target Achieved!" : "Keep going 💪";

});

// NAV
window.goToBMI=()=>location.href="bmi.html";

window.logout=()=>{
localStorage.clear();
location.href="login.html";
};

</script>

</body>
</html>
