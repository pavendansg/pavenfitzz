<!DOCTYPE html>

<html>
<head>
    <title>Dashboard - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
```

</head>

<body>

<div class="container">
<div class="card">

<h2 id="user"></h2>
<h1>🔥 Dashboard</h1>

<h3 id="streak"></h3>

<hr style="margin:15px 0; border:0.5px solid #333;">

<h3 id="bmi"></h3>
<h3 id="weight"></h3>
<h3 id="calories"></h3>
<h3 id="goal"></h3>

<!-- 🎯 TARGET INPUT -->

<div style="margin-top:10px;">
    <input type="number" id="targetInput" placeholder="Set target weight (kg)" style="padding:8px; width:60%;">
    <button onclick="saveTarget()" class="secondary-btn">Set 🎯</button>
</div>

<h4 id="targetText"></h4>
<h4 id="goalStatus"></h4>

<!-- 🔥 PROGRESS BAR -->

<h4 id="progressText"></h4>
<div style="background:#333; border-radius:10px; overflow:hidden; height:20px;">
    <div id="progressBar" style="height:100%; width:0%; background:limegreen; transition:0.5s;"></div>
</div>

<!-- 🔥 WEEKLY REPORT -->

<h3 style="margin-top:20px;">📊 Weekly Report</h3>
<h4 id="weeklyBMI"></h4>
<h4 id="weeklyWeight"></h4>
<h4 id="weeklyCalories"></h4>
<h4 id="weeklyRating"></h4>

<canvas id="chart"></canvas>

<div id="historyBox"></div>

<br>

<button class="primary-btn" onclick="goToBMI()">Update Data 🔄</button> <button class="secondary-btn" onclick="logout()">Logout 🚪</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🎯 SAVE TARGET
window.saveTarget = function(){

    let newTarget = Number(document.getElementById("targetInput").value);

    if(!newTarget){
        alert("Enter valid target ⚠️");
        return;
    }

    let current = Number(localStorage.getItem("weight")) || 0;
    let oldTarget = Number(localStorage.getItem("targetWeight"));

    let achieved = false;

    if(oldTarget){
        if(Math.abs(current - oldTarget) < 1){
            achieved = true;
        }
    }

    if(oldTarget && !achieved){
        let confirmChange = confirm("⚠️ Target not reached yet. Change anyway?");
        if(!confirmChange) return;
    }

    localStorage.setItem("targetWeight", newTarget);

    alert("Target Updated 🎯");
    location.reload();
}

// USER
let name = localStorage.getItem("username") || "User";
if(name.includes("@")) name = name.split("@")[0];
name = name.charAt(0).toUpperCase() + name.slice(1);
document.getElementById("user").innerText = "🔥 Welcome, " + name + " 💪";

onAuthStateChanged(auth, async (user) => {

if(!user){
    window.location.href = "login.html";
    return;
}

const snapshot = await getDocs(collection(db,"users",user.uid,"daily"));

if(snapshot.empty){
    document.getElementById("bmi").innerText = "No data yet ❌";
    document.getElementById("streak").innerText = "🔥 Streak: 0 days";
    return;
}

let history = [];

snapshot.forEach(doc=>{
    history.push(doc.data());
});

// SORT
history.sort((a,b)=> new Date(a.date)-new Date(b.date));

// FALLBACK WEIGHT
let currentWeight = localStorage.getItem("weight") || 0;

history = history.map(h => ({
    ...h,
    weight: h.weight || currentWeight
}));

// LAST 5 DAYS
let last5 = history.slice(-5);
let latest = last5[last5.length-1];

// SHOW BMI
document.getElementById("bmi").innerText = "BMI: " + latest.bmi;

// WEIGHT CHANGE
let prev = last5.length > 1 ? last5[last5.length-2].weight : latest.weight;
let diff = latest.weight - prev;

let trendText = "";
let color = "";

if(diff > 0){
    trendText = "📈 +" + diff + "kg";
    color = "lightgreen";
}
else if(diff < 0){
    trendText = "📉 " + diff + "kg";
    color = "red";
}
else{
    trendText = "➖ no change";
    color = "gray";
}

document.getElementById("weight").innerHTML =
`Weight: ${latest.weight} kg <span style="color:${color}">(${trendText})</span>`;

document.getElementById("calories").innerText = "Calories: " + latest.calories + " kcal";
document.getElementById("goal").innerText = "Goal: " + latest.goal;

// 🔥 TARGET + PROGRESS
let startWeight = history[0].weight;
let current = latest.weight;

let target = Number(localStorage.getItem("targetWeight"));

if(!target){
    if(latest.goal === "bulk") target = startWeight + 5;
    else if(latest.goal === "cut") target = startWeight - 5;
    else target = startWeight;
}

document.getElementById("targetText").innerText =
"Target Weight: " + target + " kg 🎯";

let status = Math.abs(current - target) < 1 ? "🎉 Target Achieved!" : "Keep going 💪";
document.getElementById("goalStatus").innerText = status;

let progress = 0;

if(latest.goal === "bulk"){
    progress = ((current - startWeight) / (target - startWeight)) * 100;
}
else if(latest.goal === "cut"){
    progress = ((startWeight - current) / (startWeight - target)) * 100;
}
else{
    progress = Math.abs(current - target) < 1 ? 100 : 50;
}

progress = Math.max(0, Math.min(100, progress));
progress = Math.round(progress);

document.getElementById("progressBar").style.width = progress + "%";
document.getElementById("progressText").innerText =
"Goal Progress: " + progress + "% 🎯";

// 🔥 STREAK
let dates = history.map(h=>new Date(h.date)).sort((a,b)=>b-a);
let streak = 1;

for(let i=0;i<dates.length-1;i++){
    let diff=(dates[i]-dates[i+1])/(1000*60*60*24);
    if(diff===1) streak++;
    else break;
}

let fire = "🔥".repeat(Math.min(streak,5));
document.getElementById("streak").innerText =
fire + " Streak: " + streak + (streak===1 ? " day" : " days");

// 🔥 WEEKLY REPORT
let last7 = history.slice(-7);

if(last7.length > 0){

    let avgBMI = last7.reduce((sum,h)=> sum + Number(h.bmi),0) / last7.length;
    avgBMI = avgBMI.toFixed(2);

    let firstWeight = last7[0].weight;
    let lastWeight = last7[last7.length-1].weight;
    let weightDiff = (lastWeight - firstWeight).toFixed(2);

    let weightTrend =
        weightDiff > 0 ? "📈 +" + weightDiff + "kg" :
        weightDiff < 0 ? "📉 " + weightDiff + "kg" :
        "➖ no change";

    let avgCalories = Math.round(
        last7.reduce((sum,h)=> sum + Number(h.calories),0) / last7.length
    );

    document.getElementById("weeklyBMI").innerText =
        "Avg BMI (7 days): " + avgBMI;

    document.getElementById("weeklyWeight").innerText =
        "Weight Change: " + weightTrend;

    document.getElementById("weeklyCalories").innerText =
        "Avg Calories: " + avgCalories + " kcal";

    let score = 0;

    if(last7.length >= 5) score += 3;
    else if(last7.length >= 3) score += 2;
    else score += 1;

    if(latest.goal === "cut" && weightDiff < 0) score += 3;
    else if(latest.goal === "bulk" && weightDiff > 0) score += 3;
    else if(latest.goal === "maintain" && Math.abs(weightDiff) < 1) score += 3;
    else score += 1;

    let firstBMI = Number(last7[0].bmi);
    let lastBMI = Number(last7[last7.length-1].bmi);

    if((latest.goal === "cut" && lastBMI < firstBMI) ||
       (latest.goal === "bulk" && lastBMI > firstBMI) ||
       (latest.goal === "maintain" && Math.abs(lastBMI - firstBMI) < 0.5)){
        score += 3;
    } else score += 1;

    let rating = score >= 8 ? "🔥 Excellent" :
                 score >= 5 ? "👍 Good" :
                 "⚠️ Needs Improvement";

    document.getElementById("weeklyRating").innerText =
        "Weekly Rating: " + rating;
}

// GRAPH
new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
        labels:last5.map(h=>h.date),
        datasets:[
        {
            label:"BMI 📊",
            data:last5.map(h=>h.bmi),
            borderWidth:3
        },
        {
            label:"Weight ⚖️",
            data:last5.map(h=>h.weight),
            borderWidth:3
        }
        ]
    }
});

// HISTORY
let box=document.getElementById("historyBox");
box.innerHTML="<b>📅 Last 5 Days:</b><br>";

last5.slice().reverse().forEach(h=>{
    box.innerHTML+=`${h.date} → BMI ${h.bmi} | ${h.weight}kg<br>`;
});

});

// NAV
window.goToBMI=()=>window.location.href="bmi.html";

// LOGOUT
window.logout=()=>{
localStorage.clear();
window.location.href="login.html";
};

</script>

</body>
</html>
