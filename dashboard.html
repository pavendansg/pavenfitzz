<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔥 GRAPH -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 🔥 PREMIUM GLOW */
        .card {
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
            to { box-shadow: 0 0 50px rgba(255,215,0,0.8); }
        }

        .history {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>🔥 Dashboard</h1>
        <h2 id="user"></h2>

        <hr style="margin:15px 0; border:0.5px solid #333;">

        <h3 id="bmi"></h3>
        <h3 id="calories"></h3>
        <h3 id="protein"></h3>
        <h3 id="carbs"></h3>
        <h3 id="fats"></h3>

        <!-- 🔥 GRAPH -->
        <canvas id="chart"></canvas>

        <!-- 🔥 HISTORY -->
        <div class="history" id="historyBox"></div>

        <br>

        <button class="primary-btn" onclick="goToBMI()">
            Update Data 🔄
        </button>

        <button class="secondary-btn" onclick="logout()">
            Logout 🚪
        </button>

    </div>
</div>

<script>

// 🔥 GET DATA
let name = localStorage.getItem("username");
let weight = Number(localStorage.getItem("weight"));
let height = Number(localStorage.getItem("height"));
let calories = Number(localStorage.getItem("calories"));
let goal = localStorage.getItem("goal");

// 🔥 PROTECT
if(!name){
    window.location.href = "login.html";
}

// USER NAME
document.getElementById("user").innerText = "Welcome, " + name + " 💪";

// 🔥 BMI
if(weight && height){
    let bmi = weight / ((height/100)*(height/100));
    document.getElementById("bmi").innerText = "BMI: " + bmi.toFixed(2);
}

// 🔥 CALORIES
if(calories){
    document.getElementById("calories").innerText = "Calories: " + calories + " kcal 🔥";
}

// 🔥 MACROS
let protein=0,fats=0,carbs=0;

if(calories && weight && goal){

    if(goal==="bulk"){
        protein=weight*2;
        fats=weight*0.8;
    }
    else if(goal==="maintain"){
        protein=weight*1.8;
        fats=weight*0.7;
    }
    else{
        protein=weight*2.2;
        fats=weight*0.6;
    }

    let used=(protein*4)+(fats*9);
    carbs=(calories-used)/4;

    protein=Math.round(protein);
    carbs=Math.round(carbs);
    fats=Math.round(fats);

    document.getElementById("protein").innerText="Protein: "+protein+"g 🍗";
    document.getElementById("carbs").innerText="Carbs: "+carbs+"g 🍚";
    document.getElementById("fats").innerText="Fats: "+fats+"g 🥑";
}

// 🔥 DATE SYSTEM
let today = new Date().toLocaleDateString();

// 🔥 HISTORY (NO DUPLICATE FIX)
let history = JSON.parse(localStorage.getItem("history")) || [];

// only save once per day
let alreadySaved = history.some(h => h.date === today);

if(!alreadySaved && weight && calories){
    history.push({
        date: today,
        weight: weight,
        calories: calories
    });
    localStorage.setItem("history", JSON.stringify(history));
}

// 🔥 GRAPH DATA
let labels = history.map(h => h.date);
let weightData = history.map(h => h.weight);

// 🔥 GRAPH
new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
        labels: labels,
        datasets: [{
            label: "Weight Progress 💪",
            data: weightData,
            borderWidth: 3,
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        animation: {
            duration: 1500
        }
    }
});

// 🔥 HISTORY UI
let box = document.getElementById("historyBox");
box.innerHTML = "<b>📅 History:</b><br>";

history.slice().reverse().forEach(h=>{
    box.innerHTML += `${h.date} → ${h.weight}kg | ${h.calories} kcal<br>`;
});

// 🔥 NAV
function goToBMI(){
    window.location.href="bmi.html";
}

// 🔥 LOGOUT
function logout(){
    localStorage.clear();
    window.location.href="login.html";
}

</script>

</body>
</html>
