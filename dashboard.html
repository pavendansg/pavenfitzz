<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// 🔥 YOUR CONFIG
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "evolvefit-07",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔥 USER CHECK
let name = localStorage.getItem("username");
if(!name) window.location.href="login.html";

document.getElementById("user").innerText="🔥 "+name;

// 🔥 LOAD DATA FROM FIREBASE
async function loadData(){

    const user = auth.currentUser;

    if(!user){
        setTimeout(loadData,1000); // wait for auth
        return;
    }

    const q = query(
        collection(db, "users"),
        where("uid","==",user.uid)
    );

    const querySnapshot = await getDocs(q);

    let history = [];

    querySnapshot.forEach(doc=>{
        history.push(doc.data());
    });

    if(history.length === 0){
        document.getElementById("bmi").innerText="No data yet ❌";
        return;
    }

    // 🔥 SORT BY DATE (latest last)
    history.sort((a,b)=> new Date(a.date) - new Date(b.date));

    let latest = history[history.length - 1];

    let weight = Number(localStorage.getItem("weight")) || 60;
    let height = Number(localStorage.getItem("height")) || 170;
    let goal = localStorage.getItem("goal");

    // BMI
    document.getElementById("bmi").innerText = "BMI: " + latest.bmi;

    // Calories
    document.getElementById("calories").innerText = "Calories: " + latest.calories;

    // MACROS (same logic)
    let protein=0,fats=0,carbs=0;

    if(goal==="bulk"){ protein=weight*2; fats=weight*0.8; }
    else if(goal==="maintain"){ protein=weight*1.8; fats=weight*0.7; }
    else { protein=weight*2.2; fats=weight*0.6; }

    let used=(protein*4)+(fats*9);
    carbs=(latest.calories-used)/4;

    protein=Math.round(protein);
    carbs=Math.round(carbs);
    fats=Math.round(fats);

    document.getElementById("protein").innerText="Protein: "+protein+"g";
    document.getElementById("carbs").innerText="Carbs: "+carbs+"g";
    document.getElementById("fats").innerText="Fats: "+fats+"g";

    // 📊 GRAPH
    new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: history.map(h=>h.date),
            datasets: [{
                label: "BMI 📊",
                data: history.map(h=>h.bmi),
                borderWidth: 3,
                tension: 0.4
            }]
        }
    });

    // 📅 HISTORY
    let box = document.getElementById("historyBox");
    box.innerHTML="<b>📅 History:</b><br>";

    history.slice().reverse().forEach(h=>{
        box.innerHTML += `${h.date} → BMI ${h.bmi}<br>`;
    });
}

// RUN
loadData();

// NAV
window.goToBMI = function(){ window.location.href="bmi.html"; }
window.logout = function(){ localStorage.clear(); window.location.href="login.html"; }

</script>
