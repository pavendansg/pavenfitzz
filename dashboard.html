<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
<div class="card" style="padding:24px;">

<!-- 👤 HEADER -->
<div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
    <img id="profilePic" style="width:52px;height:52px;border-radius:50%;border:2px solid limegreen;">
    <h2 id="user" style="margin:0;"></h2>
</div>

<h1 style="margin-bottom:6px;">🔥 Dashboard</h1>
<h3 id="streak" style="margin-bottom:20px; opacity:0.85;"></h3>

<!-- 📊 STATS -->
<div style="background:#111; padding:16px; border-radius:14px; margin-bottom:18px; line-height:1.9; font-size:17px;">
    <p id="bmi"></p>
    <p id="weight"></p>
    <p id="calories"></p>
    <p id="goal"></p>
</div>

<!-- 🎯 TARGET -->
<div style="background:#111; padding:16px; border-radius:14px; margin-bottom:18px;">
    <h3 id="targetText" style="margin-bottom:6px;"></h3>
    <p id="goalStatus" style="opacity:0.75;"></p>
</div>

<!-- 📈 PROGRESS -->
<div style="background:#111; padding:16px; border-radius:14px; margin-bottom:20px;">
    <p id="progressText" style="margin-bottom:10px;"></p>

    <div style="background:#333;height:20px;border-radius:12px;overflow:hidden;">
        <div id="progressBar" 
        style="height:100%;width:0%;background:linear-gradient(90deg,limegreen,#00ffcc); transition:0.6s;">
        </div>
    </div>
</div>

<!-- 🔘 BUTTONS -->
<div style="display:flex; gap:14px;">
    <button style="flex:1;" onclick="goToBMI()">Update 🔄</button>
    <button style="flex:1;" onclick="logout()">Logout 🚪</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let name = localStorage.getItem("username") || "User";
let photo = localStorage.getItem("photo");

document.getElementById("user").innerText = "🔥 Welcome, " + name + " 💪";
document.getElementById("profilePic").src = photo || "";

// AUTH
onAuthStateChanged(auth, async (user) => {

    if(!user){
        window.location.href = "login.html";
        return;
    }

    const snap = await getDocs(collection(db,"users",user.uid,"daily"));

    if(snap.empty){
        document.getElementById("bmi").innerText="No BMI data yet ❌";
        document.getElementById("streak").innerText="🔥 Streak: 0 days";
        document.getElementById("targetText").innerText="Go calculate BMI first 💪";
        return;
    }

    let history=[];
    snap.forEach(d=>history.push(d.data()));

    history.sort((a,b)=> new Date(a.date)-new Date(b.date));

    let latest=history[history.length-1];

    // DATA
    document.getElementById("bmi").innerText="BMI: "+latest.bmi;

    let prev = history.length > 1 ? history[history.length-2].weight : latest.weight;
    let diff = latest.weight - prev;

    if(isNaN(diff)) diff = 0;

    let changeText = diff === 0 
      ? "— no change" 
      : diff > 0 
        ? `⬆ +${diff} kg` 
        : `⬇ ${Math.abs(diff)} kg`;

    document.getElementById("weight").innerText =
    "Weight: " + latest.weight + " kg (" + changeText + ")";

    document.getElementById("calories").innerText="Calories: "+latest.calories+" kcal";
    document.getElementById("goal").innerText="Goal: "+latest.goal;

    // STREAK
    let streak = 1;

    for(let i = history.length - 1; i > 0; i--){
        let d1 = new Date(history[i].date);
        let d2 = new Date(history[i-1].date);

        let diffDays = (d1 - d2) / (1000 * 60 * 60 * 24);

        if(diffDays === 1){
            streak++;
        } else break;
    }

    document.getElementById("streak").innerText =
    "🔥 Streak: " + streak + " days";

    // TARGET + PROGRESS
    let start = Number(localStorage.getItem("startWeight"));
    let target = Number(localStorage.getItem("targetWeight"));
    let current = latest.weight;

    if(!start) start = current;
    if(!target) target = start + 5;

    document.getElementById("targetText").innerText="Target: "+target+" kg 🎯";

    let progress = 0;

    if(latest.goal === "cut"){
        let total = start - target;
        let done = start - current;
        if(total > 0) progress = (done / total) * 100;
    } else {
        let total = target - start;
        let done = current - start;
        if(total > 0) progress = (done / total) * 100;
    }

    if(!isFinite(progress)) progress = 0;

    progress = Math.max(0, Math.min(100, Math.round(progress)));

    document.getElementById("progressBar").style.width = progress + "%";
    document.getElementById("progressText").innerText = "Goal Progress: " + progress + "% 🎯";

    document.getElementById("goalStatus").innerText =
    progress >= 100 ? "🏆 Target Achieved!" : "Keep going 💪";

});

// NAV
window.goToBMI = () => location.href = "bmi.html";

window.logout = () => {
    localStorage.clear();
    location.href = "login.html";
};

</script>

</body>
</html>
