<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER NAME
let name = localStorage.getItem("username");
document.getElementById("user").innerText = "🔥 " + name;

// 🔥 WAIT FOR USER THEN LOAD DATA
onAuthStateChanged(auth, async (user) => {

    if(!user){
        window.location.href = "login.html";
        return;
    }

    const q = query(
        collection(db, "users"),
        where("uid", "==", user.uid)
    );

    const querySnapshot = await getDocs(q);

    if(querySnapshot.empty){
        document.getElementById("bmi").innerText = "No data yet ❌";
        return;
    }

    let data = [];

    querySnapshot.forEach(doc => {
        data.push(doc.data());
    });

    // GET LATEST
    data.sort((a,b) => new Date(b.date) - new Date(a.date));
    let latest = data[0];

    document.getElementById("bmi").innerText = "BMI: " + latest.bmi;
    document.getElementById("calories").innerText = "Calories: " + latest.calories;

});

</script>
