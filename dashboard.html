<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔥 CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">
<div class="card">

<h1>🔥 Dashboard</h1>
<h2 id="user"></h2>

<hr style="margin:15px 0; border:0.5px solid #333;">

<h3 id="bmi"></h3>
<h3 id="calories"></h3>
<h3 id="protein"></h3>
<h3 id="carbs"></h3>
<h3 id="fats"></h3>

<canvas id="chart"></canvas>

<div id="historyBox" style="margin-top:20px;"></div>

<br>

<button class="primary-btn" onclick="goToBMI()">Update Data 🔄</button>
<button class="secondary-btn" onclick="logout()">Logout 🚪</button>

</div>
</div>

<!-- 🔥 FIREBASE (WORKING VERSION) -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>

// 🔥 YOUR CONFIG (PUT YOUR REAL VALUES HERE)
const firebaseConfig = {
   apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07",
  storageBucket: "evolvefit-07.firebasestorage.app",
  messagingSenderId: "977676324550",
  appId: "1:977676324550:web:a09fb4dfea6c38190851c7",
  measurementId: "G-G5KYXR7CDH"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// 🔥 USER NAME
let name = localStorage.getItem("username");

if(!name){
    window.location.href="login.html";
}

document.getElementById("user").innerText = "Welcome, " + name + " 💪";

// 🔥 LOAD DATA
auth.onAuthStateChanged(async (user) => {

    if(!user){
        window.location.href="login.html";
        return;
    }

    const snapshot = await db.collection("users")
        .where("uid", "==", user.uid)
        .get();

    let history = [];

    snapshot.forEach(doc=>{
        history.push(doc.data());
    });

    if(history.length === 0){
        document.getElementById("bmi").innerText = "No data yet ❌";
        return;
    }

    // SORT
    history.sort((a,b)=> new Date(a.date) - new Date(b.date));

    let latest = history[history.length - 1];

    let weight = Number(localStorage.getItem("weight")) || 60;
    let goal = localStorage.getItem("goal");

    // SHOW DATA
    document.getElementById("bmi").innerText = "BMI: " + latest.bmi;
    document.getElementById("calories").innerText = "Calories: " + latest.calories;

    // MACROS
    let protein=0,fats=0,carbs=0;

    if(goal==="bulk"){ protein=weight*2; fats=weight*0.8; }
    else if(goal==="maintain"){ protein=weight*1.8; fats=weight*0.7; }
    else { protein=weight*2.2; fats=weight*0.6; }

    let used=(protein*4)+(fats*9);
    carbs=(latest.calories-used)/4;

    document.getElementById("protein").innerText="Protein: "+Math.round(protein)+"g";
    document.getElementById("carbs").innerText="Carbs: "+Math.round(carbs)+"g";
    document.getElementById("fats").innerText="Fats: "+Math.round(fats)+"g";

    // GRAPH
    new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: history.map(h=>h.date),
            datasets: [{
                label: "BMI 📊",
                data: history.map(h=>h.bmi),
                borderWidth: 3
            }]
        }
    });

    // HISTORY
    let box = document.getElementById("historyBox");
    box.innerHTML = "<b>📅 History:</b><br>";

    history.slice().reverse().forEach(h=>{
        box.innerHTML += `${h.date} → BMI ${h.bmi}<br>`;
    });

});

// NAV
function goToBMI(){
    window.location.href="bmi.html";
}

function logout(){
    firebase.auth().signOut();
    localStorage.clear();
    window.location.href="login.html";
}

</script>

</body>
</html>
