<!DOCTYPE html>
<html>
<head>
    <title>Progress Graph - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">
<div class="card">

<h1>📈 Progress Graph</h1>
<p style="opacity:.8; margin-bottom:18px;">
Track your transformation journey
</p>

<div class="box">
    <canvas id="weightChart"></canvas>
</div>

<div class="box">
    <canvas id="bmiChart"></canvas>
</div>

<div class="box">
    <p id="summary"></p>
</div>

<div class="btns">
    <button class="primary-btn" onclick="goBack()">
        ⬅ Dashboard
    </button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
 authDomain: "evolvefit-07.firebaseapp.com",
 projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// AUTH
onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

const snap = await getDocs(collection(db,"users",user.uid,"daily"));

if(snap.empty){
location.href="dashboard.html";
return;
}

let history = [];
snap.forEach(doc => history.push(doc.data()));

history.sort((a,b)=>
new Date(a.date)-new Date(b.date)
);

let labels = history.map(x => x.date);
let weights = history.map(x => x.weight);
let bmis = history.map(x => x.bmi);

// WEIGHT CHART
new Chart(document.getElementById("weightChart"),{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Weight (kg)",
data:weights,
borderColor:"#ffd700",
backgroundColor:"rgba(255,215,0,.15)",
fill:true,
tension:.35
}]
},
options:{
plugins:{
legend:{labels:{color:"white"}}
},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}
});

// BMI CHART
new Chart(document.getElementById("bmiChart"),{
type:"line",
data:{
labels:labels,
datasets:[{
label:"BMI",
data:bmis,
borderColor:"#00ff99",
backgroundColor:"rgba(0,255,153,.12)",
fill:true,
tension:.35
}]
},
options:{
plugins:{
legend:{labels:{color:"white"}}
},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}
});

// SUMMARY
let first = history[0];
let latest = history[history.length-1];

let total = latest.weight - first.weight;

let msg =
total > 0
? "🔥 Total Gain: +" + total + " kg"
: total < 0
? "🔥 Total Loss: " + Math.abs(total) + " kg"
: "🔥 No change yet";

document.getElementById("summary").innerText = msg;

});

// NAV
window.goBack = ()=>{
location.href="dashboard.html";
}

</script>

</body>
</html>
