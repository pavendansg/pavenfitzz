<!DOCTYPE html>
<html>
<head>
    <title>Elite Progress Graph - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">
<div class="card">

<h1 style="color:#ffd700;">📈 Elite Progress</h1>
<p style="opacity:.8;margin-bottom:18px;">
Your body transformation analytics
</p>

<!-- STATS -->
<div class="box">
    <p id="startWeight"></p>
    <p id="currentWeight"></p>
    <p id="goalWeight"></p>
    <p id="changeText"></p>
</div>

<!-- WEIGHT -->
<div class="box">
    <h3 style="margin-bottom:10px;">⚖️ Weight Trend</h3>
    <canvas id="weightChart"></canvas>
</div>

<!-- BMI -->
<div class="box">
    <h3 style="margin-bottom:10px;">🔥 BMI Trend</h3>
    <canvas id="bmiChart"></canvas>
</div>

<!-- MOTIVATION -->
<div class="box">
    <p id="summary" style="color:#ffd700;font-weight:700;"></p>
</div>

<div class="btns">
    <button class="primary-btn" onclick="goBack()">⬅ Dashboard</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
 authDomain:"evolvefit-07.firebaseapp.com",
 projectId:"evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="login.html";
return;
}

const snap = await getDocs(collection(db,"users",user.uid,"daily"));

if(snap.empty){
location.href="dashboard.html";
return;
}

let history = [];
snap.forEach(doc=>history.push(doc.data()));

history.sort((a,b)=>
new Date(a.date)-new Date(b.date)
);

let labels = history.map(x=>x.date);
let weights = history.map(x=>x.weight);
let bmi = history.map(x=>x.bmi);

let first = history[0];
let latest = history[history.length-1];

let target = Number(localStorage.getItem("targetWeight")) || first.weight + 5;

let total = latest.weight - first.weight;

// STATS
document.getElementById("startWeight").innerText =
"🏁 Start Weight: " + first.weight + " kg";

document.getElementById("currentWeight").innerText =
"💪 Current Weight: " + latest.weight + " kg";

document.getElementById("goalWeight").innerText =
"🎯 Goal Weight: " + target + " kg";

document.getElementById("changeText").innerText =
total>0
? "📈 Total Gain: +" + total + " kg"
: total<0
? "📉 Total Loss: " + Math.abs(total) + " kg"
: "➖ No Change Yet";

// WEIGHT CHART
new Chart(document.getElementById("weightChart"),{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Weight (kg)",
data:weights,
borderColor:"#ffd700",
backgroundColor:"rgba(255,215,0,.12)",
fill:true,
pointRadius:5,
tension:.4
}]
},
options:{
plugins:{
legend:{labels:{color:"white"}}
},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}
});

// BMI CHART
new Chart(document.getElementById("bmiChart"),{
type:"line",
data:{
labels:labels,
datasets:[{
label:"BMI",
data:bmi,
borderColor:"#00ff99",
backgroundColor:"rgba(0,255,153,.12)",
fill:true,
pointRadius:5,
tension:.4
}]
},
options:{
plugins:{
legend:{labels:{color:"white"}}
},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}
});

// MOTIVATION
let msg = "";

if(total > 0){
msg = "🔥 You're building momentum!";
}
else if(total < 0){
msg = "🔥 Fat loss in progress!";
}
else{
msg = "🔥 Start strong. Consistency wins.";
}

document.getElementById("summary").innerText = msg;

});

window.goBack=()=>{
location.href="dashboard.html";
}

</script>

</body>
</html>
