<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PavenFitzz — Diet Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.header{text-align:center;margin-bottom:28px;}
.logo{font-size:44px;animation:logoBounce .9s var(--spring) .1s both;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tagline{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:2px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.gen-btn{width:100%;padding:16px;border:none;border-radius:var(--r-md);margin-top:22px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--orange));color:#080808;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;transition:all .3s var(--spring);box-shadow:0 4px 20px rgba(240,192,64,0.2);}
.gen-btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(240,192,64,0.35);}
.gen-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

.result{margin-top:24px;}
.analysis-card{background:rgba(0,255,136,0.03);backdrop-filter:var(--glass-blur);border:1px solid rgba(0,255,136,0.16);border-radius:var(--r-lg);padding:22px;margin-bottom:16px;box-shadow:0 0 40px rgba(0,255,136,0.05);}
.body-type-header{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.body-type-icon{width:56px;height:56px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(0,255,136,0.08);backdrop-filter:var(--glass-blur-sm);border:1px solid rgba(0,255,136,0.2);}
.body-type-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--green);}
.body-type-sub{font-size:13px;color:var(--muted);margin-top:2px;}

.bmi-bar-wrap{margin-bottom:16px;}
.bmi-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:6px;}
.bmi-bar{height:10px;border-radius:var(--r-full);background:linear-gradient(90deg,var(--blue),var(--green),var(--gold),var(--red));position:relative;}
.bmi-marker{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #080808;transform:translateX(-50%);transition:left .6s var(--ease);box-shadow:0 0 12px rgba(255,255,255,0.4);}
.bmi-ranges{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;}

.trait-list{display:flex;flex-wrap:wrap;gap:8px;}
.trait{background:rgba(0,255,136,0.05);backdrop-filter:var(--glass-blur-sm);border:1px solid rgba(0,255,136,0.15);color:#aaa;font-size:12px;padding:5px 12px;border-radius:var(--r-full);font-family:var(--font-mono);}

.macro-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--gold);margin-bottom:14px;}
.macro-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.macro-item{background:var(--glass);backdrop-filter:var(--glass-blur-sm);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:12px;text-align:center;transition:all .25s var(--spring);}
.macro-item:hover{background:var(--glass-hover);transform:translateY(-2px);}
.macro-val{font-family:'Bebas Neue',sans-serif;font-size:22px;}
.macro-val.orange{color:var(--orange);}
.macro-val.green{color:var(--green);}
.macro-val.blue{color:var(--blue);}
.macro-val.gold{color:var(--gold);}
.macro-lbl{font-size:10px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}

.macro-bar-wrap{margin-top:14px;}
.macro-bar-track{height:8px;border-radius:var(--r-full);background:rgba(255,255,255,0.05);overflow:hidden;display:flex;}
.macro-bar-p{background:var(--green);}
.macro-bar-c{background:var(--blue);}
.macro-bar-f{background:var(--gold);}
.macro-legend{display:flex;gap:14px;margin-top:6px;font-size:11px;font-family:var(--font-mono);color:var(--muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}

.meal-section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--orange);margin-bottom:14px;}
.meal-item{padding:10px 0;border-bottom:1px solid var(--glass-border);}
.meal-item:last-child{border-bottom:none;}
.meal-time{font-size:10px;color:var(--gold);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.meal-foods{font-size:14px;color:#ccc;line-height:1.7;}
.meal-macros{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;}

.foods-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--green);margin-bottom:14px;}
.food-tags{display:flex;flex-wrap:wrap;gap:8px;}
.food-tag{background:rgba(0,255,136,0.05);backdrop-filter:var(--glass-blur-sm);border:1px solid rgba(0,255,136,0.15);color:#aaa;font-size:13px;padding:6px 14px;border-radius:var(--r-full);transition:all .2s var(--spring);}
.food-tag:hover{transform:scale(1.05);}
.food-tag.avoid{background:rgba(240,69,69,0.05);border-color:rgba(240,69,69,0.2);color:#ff7777;}

.lock-note{background:var(--glass);backdrop-filter:var(--glass-blur-sm);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:12px 14px;margin-top:4px;font-size:13px;color:var(--muted);line-height:1.7;}
.lock-note strong{color:var(--gold);}

.btn-next{width:100%;padding:15px;border:none;border-radius:var(--r-md);font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font-body);background:linear-gradient(135deg,var(--green),var(--blue));color:#080808;margin-top:14px;transition:all .3s var(--spring);box-shadow:0 4px 20px rgba(0,255,136,0.2);}
.btn-next:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,255,136,0.35);}

.error-box{background:rgba(240,69,69,0.06);color:#f07070;padding:16px;border-radius:var(--r-md);margin-top:14px;border:1px solid rgba(240,69,69,0.2);font-size:14px;backdrop-filter:var(--glass-blur-sm);animation:shake .4s var(--spring);}

.locked-banner{background:linear-gradient(135deg,rgba(240,192,64,0.06),rgba(240,192,64,0.02));backdrop-filter:var(--glass-blur);border:1px solid rgba(240,192,64,0.18);border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.locked-banner strong{color:var(--gold);}
.locked-banner p{font-size:13px;color:#aaa;line-height:1.6;}

@media(max-width:600px){ .macro-grid-4{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<div id="pageTransition" class="enter"></div>

<div class="wrap">
  <div class="header slide-up">
    <div class="logo">🧬</div>
    <div class="brand">Diet Planner</div>
    <div class="tagline">BODY TYPE ANALYSIS + PERSONALIZED DIET</div>
  </div>
  <div class="nav slide-up stagger-1">
    <a href="workout.html">💪 Workout</a>
    <a href="diet.html" class="active">🧬 Diet</a>
    <a href="meal.html">🍗 Meal</a>
   <a href="dashboard-premium.html">🏠 Dashboard</a>
  </div>

  <div id="mainContent">
    <div class="hint-box slide-up stagger-2" id="prefillBanner" style="display:none;">
      ✅ <strong>Using your saved details.</strong> Update any value below if it's changed (e.g. new weight after check-in).
    </div>
    <div class="card slide-up stagger-2">
      <div class="two-col">
        <div><label class="input-label">Height (cm)</label><input type="number" id="height" placeholder="e.g. 175"></div>
        <div><label class="input-label">Weight (kg)</label><input type="number" id="weight" placeholder="e.g. 70"></div>
      </div>
      <div class="two-col">
        <div><label class="input-label">Age</label><input type="number" id="age" placeholder="e.g. 22"></div>
        <div><label class="input-label">Gender</label>
          <select id="gender"><option value="male">Male</option><option value="female">Female</option></select>
        </div>
      </div>
      <label class="input-label">Activity Level</label>
      <select id="activity">
        <option value="1.2">Sedentary (desk job, no exercise)</option>
        <option value="1.375">Light (1-3 days/week)</option>
        <option value="1.55" selected>Moderate (3-5 days/week)</option>
        <option value="1.725">Active (6-7 days/week)</option>
        <option value="1.9">Very Active (athlete/hard training)</option>
      </select>
      <label class="input-label">Your Goal</label>
      <select id="userGoal">
        <option value="Bulk">Bulk — Build Muscle & Gain Weight</option>
        <option value="Cut">Cut — Lose Fat & Get Lean</option>
        <option value="Maintain">Maintain — Stay at Current Weight</option>
        <option value="Recomp">Recomp — Lose Fat + Gain Muscle</option>
      </select>
      <button class="gen-btn" id="genBtn" onclick="analyzeDiet()">Analyze My Body & Generate Diet 🧬</button>
    </div>
    <div id="dietResult" class="result"></div>
  </div>
</div>

<script>
// ✅ STEP GUARD
if (localStorage.getItem("premium") !== "true") { location.href = "payment.html"; }
if (!localStorage.getItem("workoutLockStart")) { location.href = "workout.html"; }
const WORKER = "https://pavenfitzz-ai.pavendansg.workers.dev/";

window.onload = function() {
  const saved = localStorage.getItem("dietData");
  const savedDate = localStorage.getItem("dietDate");
  if (saved && savedDate === new Date().toDateString()) {
    document.getElementById("mainContent").innerHTML =
      `<div class="locked-banner"><div style="font-size:24px;">🔒</div>
      <div><strong>Today's Diet Plan Ready</strong><p>Generated once per day. Come back tomorrow for a fresh plan.</p></div></div>`
      + renderDietHTML(JSON.parse(saved));
    return;
  }

  // ✅ PREFILL from setup data — user doesn't have to retype everything
  const savedHeight   = localStorage.getItem("height");
  const savedWeight   = localStorage.getItem("weight");
  const savedAge      = localStorage.getItem("age");
  const savedGender   = localStorage.getItem("gender");
  const savedActivity = localStorage.getItem("activity");
  const savedGoal     = localStorage.getItem("goal"); // bulk/cut/maintain (lowercase from setup.html)

  if (savedHeight)   document.getElementById("height").value = savedHeight;
  if (savedWeight)   document.getElementById("weight").value = savedWeight;
  if (savedAge)      document.getElementById("age").value = savedAge;
  if (savedGender)   document.getElementById("gender").value = savedGender;
  if (savedActivity) document.getElementById("activity").value = savedActivity;

  // Map setup.html's lowercase goal to this page's dropdown values
  const goalMap = { bulk: "Bulk", cut: "Cut", maintain: "Maintain" };
  if (savedGoal && goalMap[savedGoal]) {
    document.getElementById("userGoal").value = goalMap[savedGoal];
  }

  if (savedHeight && savedWeight && savedAge) {
    document.getElementById("prefillBanner").style.display = "block";
  }
};

function calcBMI(w,h){ return (w/((h/100)**2)).toFixed(1); }

function getBodyType(bmi) {
  if(bmi<18.5) return {type:"Ectomorph",icon:"🦴",desc:"Naturally lean, fast metabolism, hard to gain weight",traits:["Fast metabolism","Thin frame","Hard gainer","Low body fat"]};
  if(bmi<25)   return {type:"Mesomorph",icon:"💪",desc:"Athletic build, gains muscle easily, balanced metabolism",traits:["Athletic build","Gains muscle easily","Medium frame","Good metabolism"]};
  if(bmi<30)   return {type:"Endomorph",icon:"🔥",desc:"Solid build, gains weight easily, needs more cardio",traits:["Gains weight easily","Strong build","Slower metabolism","Good strength"]};
  return {type:"Endomorph+",icon:"⚡",desc:"Higher body fat, prioritize fat loss with structured diet",traits:["High body fat","Slow metabolism","Strong base","Needs deficit"]};
}

function calcTDEE(weight,height,age,gender,activity) {
  const bmr = gender==="male"
    ? (10*weight)+(6.25*height)-(5*age)+5
    : (10*weight)+(6.25*height)-(5*age)-161;
  return Math.round(bmr*activity);
}

function getCalorieTarget(tdee,goal) {
  if(goal==="Bulk") return tdee+350;
  if(goal==="Cut")  return tdee-400;
  return tdee;
}

function getMacros(calories,weight,goal) {
  let protein,fat,carbs;
  if(goal==="Bulk")   { protein=Math.round(weight*2.0); fat=Math.round(weight*0.8); }
  else if(goal==="Cut")    { protein=Math.round(weight*2.4); fat=Math.round(weight*0.7); }
  else if(goal==="Recomp") { protein=Math.round(weight*2.2); fat=Math.round(weight*0.75); }
  else                     { protein=Math.round(weight*1.8); fat=Math.round(weight*0.7); }
  carbs=Math.max(0,Math.round((calories-(protein*4)-(fat*9))/4));
  return {protein,fat,carbs};
}

async function analyzeDiet() {
  const height   = parseFloat(document.getElementById("height").value);
  const weight   = parseFloat(document.getElementById("weight").value);
  const age      = parseInt(document.getElementById("age").value);
  const gender   = document.getElementById("gender").value;
  const activity = parseFloat(document.getElementById("activity").value);
  const goal     = document.getElementById("userGoal").value;
  if(!height||!weight||!age){ alert("⚠️ Fill all fields!"); return; }

  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  document.getElementById("dietResult").innerHTML =
    `<div class="loading">🧬 Analyzing Your Body Type<div class="dots"><span></span><span></span><span></span></div></div>`;

  const bmi       = calcBMI(weight,height);
  const bodyType  = getBodyType(parseFloat(bmi));
  const tdee      = calcTDEE(weight,height,age,gender,activity);
  const calTarget = getCalorieTarget(tdee,goal);
  const macros    = getMacros(calTarget,weight,goal);
  const bmiPct    = Math.min(100,Math.max(0,((parseFloat(bmi)-15)/(40-15))*100)).toFixed(0);

  const prompt = `You are an expert Indian nutritionist. Create a personalized diet plan.
Body: ${gender}, ${age} years, ${height}cm, ${weight}kg
BMI: ${bmi} — Body Type: ${bodyType.type}
Goal: ${goal}
Daily Calories: ${calTarget}kcal
Targets: ${macros.protein}g protein, ${macros.carbs}g carbs, ${macros.fat}g fat
Create a COMPLETE Indian diet plan. Format STRICTLY:
MEAL PLAN:
Breakfast | 7:00 AM | Xcal | Xg P
- [food item with quantity]
Lunch | 1:00 PM | Xcal | Xg P
- [food item with quantity]
Snack | 4:00 PM | Xcal | Xg P
- [food item with quantity]
Dinner | 8:00 PM | Xcal | Xg P
- [food item with quantity]
EAT MORE:
[list 6 best foods for ${bodyType.type} + ${goal} goal, one per line]
AVOID:
[list 4 foods to avoid, one per line]
TIPS:
[3 specific tips for ${bodyType.type} body type with ${goal} goal]
Keep it short, practical, Indian foods. No extra text.`;

  try {
    const res  = await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
    const data = await res.json();
    const text = data.text||"";
    if(!text) throw new Error("No response from AI");
    const parsed   = parseDiet(text);
    const fullData = {bmi,bodyType,tdee,calTarget,macros,bmiPct,goal,parsed,weight,height,age,gender};
    localStorage.setItem("dietData", JSON.stringify(fullData));
    localStorage.setItem("dietDate", new Date().toDateString());

    // ✅ SYNC BACK — keep the main profile keys updated so every other page
    // (dashboard, meal, future visits) reflects the latest values too
    localStorage.setItem("height", height);
    localStorage.setItem("weight", weight);
    localStorage.setItem("age", age);
    localStorage.setItem("gender", gender);
    localStorage.setItem("activity", activity);
    localStorage.setItem("bmi", bmi);
    localStorage.setItem("calories", calTarget);
    localStorage.setItem("protein", macros.protein);
    localStorage.setItem("carbs", macros.carbs);
    localStorage.setItem("fats", macros.fat);
    const goalMapBack = { Bulk: "bulk", Cut: "cut", Maintain: "maintain", Recomp: "cut" };
    localStorage.setItem("goal", goalMapBack[goal] || goal.toLowerCase());

    document.getElementById("dietResult").innerHTML = renderDietHTML(fullData);
  } catch(err) {
    document.getElementById("dietResult").innerHTML = `<div class="error-box">⚠️ ${err.message}</div>`;
  }
  btn.disabled = false;
}

function parseDiet(text) {
  const lines   = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const meals   = [], eatMore = [], avoid = [], tips = [];
  let section = "", current = null;
  lines.forEach(line => {
    if(line.match(/^meal plan/i))  { section="meals"; return; }
    if(line.match(/^eat more/i))   { if(current) meals.push(current); current=null; section="eat"; return; }
    if(line.match(/^avoid/i))      { section="avoid"; return; }
    if(line.match(/^tips/i))       { section="tips"; return; }
    if(section==="meals") {
      if(line.match(/^(breakfast|lunch|snack|dinner|pre|post)/i)) {
        if(current) meals.push(current);
        const parts = line.split("|").map(p=>p.trim());
        current={name:parts[0]||line,time:parts[1]||"",cal:(parts[2]||"").replace("cal","").replace("kcal","").trim(),prot:(parts[3]||"").replace("g P","").replace("g protein","").trim(),foods:[]};
      } else if(current&&line.match(/^[•\-]/)) current.foods.push(line.replace(/^[•\-]\s*/,""));
    }
    if(section==="eat"   &&line.match(/^[•\-]/)) eatMore.push(line.replace(/^[•\-]\s*/,""));
    if(section==="avoid" &&line.match(/^[•\-]/)) avoid.push(line.replace(/^[•\-]\s*/,""));
    if(section==="tips"  &&line.match(/^[•\-\d]/)) tips.push(line.replace(/^[\d\.\-•]\s*/,""));
  });
  if(current) meals.push(current);
  return {meals,eatMore,avoid,tips};
}

function renderDietHTML(data) {
  const {bmi,bodyType,tdee,calTarget,macros,bmiPct,goal,parsed} = data;
  const totalMacCal = (macros.protein*4)+(macros.carbs*4)+(macros.fat*9);
  const pPct = Math.round((macros.protein*4)/totalMacCal*100);
  const cPct = Math.round((macros.carbs*4)/totalMacCal*100);
  const fPct = 100-pPct-cPct;
  const mealEmojis = {breakfast:"🌅",lunch:"☀️",snack:"⚡",dinner:"🌙",pre:"💪",post:"🔄"};

  let html = `
    <div class="analysis-card slide-up">
      <div class="body-type-header">
        <div class="body-type-icon">${bodyType.icon}</div>
        <div>
          <div class="body-type-name">${bodyType.type}</div>
          <div class="body-type-sub">${bodyType.desc}</div>
        </div>
      </div>
      <div class="stats-4">
        <div class="stat-box"><div class="stat-val green">${bmi}</div><div class="stat-lbl">BMI</div></div>
        <div class="stat-box"><div class="stat-val gold">${calTarget}</div><div class="stat-lbl">Calories</div></div>
        <div class="stat-box"><div class="stat-val blue">${tdee}</div><div class="stat-lbl">TDEE</div></div>
        <div class="stat-box"><div class="stat-val orange">${goal}</div><div class="stat-lbl">Goal</div></div>
      </div>
      <div class="bmi-bar-wrap">
        <div class="bmi-bar-label"><span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span></div>
        <div class="bmi-bar"><div class="bmi-marker" style="left:${bmiPct}%"></div></div>
        <div class="bmi-ranges"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
      </div>
      <div class="trait-list">${bodyType.traits.map(t=>`<span class="trait">${t}</span>`).join("")}</div>
    </div>

    <div class="card slide-up stagger-1">
      <div class="macro-title">📊 Daily Macro Targets</div>
      <div class="macro-grid-4">
        <div class="macro-item"><div class="macro-val orange">${calTarget}</div><div class="macro-lbl">Calories</div></div>
        <div class="macro-item"><div class="macro-val green">${macros.protein}g</div><div class="macro-lbl">Protein</div></div>
        <div class="macro-item"><div class="macro-val blue">${macros.carbs}g</div><div class="macro-lbl">Carbs</div></div>
        <div class="macro-item"><div class="macro-val gold">${macros.fat}g</div><div class="macro-lbl">Fat</div></div>
      </div>
      <div class="macro-bar-wrap">
        <div class="macro-bar-track">
          <div class="macro-bar-p" style="width:${pPct}%"></div>
          <div class="macro-bar-c" style="width:${cPct}%"></div>
          <div class="macro-bar-f" style="width:${fPct}%"></div>
        </div>
        <div class="macro-legend">
          <span><span class="legend-dot" style="background:var(--green)"></span>Protein ${pPct}%</span>
          <span><span class="legend-dot" style="background:var(--blue)"></span>Carbs ${cPct}%</span>
          <span><span class="legend-dot" style="background:var(--gold)"></span>Fat ${fPct}%</span>
        </div>
      </div>
    </div>`;

  if(parsed.meals.length>0){
    html+=`<div class="card slide-up stagger-2"><div class="meal-section-title">🍽️ Daily Meal Plan</div>`;
    parsed.meals.forEach(meal=>{
      const key=Object.keys(mealEmojis).find(k=>meal.name.toLowerCase().includes(k));
      const emoji=key?mealEmojis[key]:"🍽️";
      html+=`<div class="meal-item">
        <div class="meal-time">${emoji} ${meal.name} ${meal.time?"· "+meal.time:""}</div>
        <div class="meal-foods">${meal.foods.map(f=>"• "+f).join("<br>")}</div>
        ${meal.cal||meal.prot?`<div class="meal-macros">${meal.cal?meal.cal+"kcal":""} ${meal.prot?"· "+meal.prot+"g protein":""}</div>`:""}
      </div>`;
    });
    html+=`</div>`;
  }

  if(parsed.eatMore.length>0){
    html+=`<div class="card slide-up"><div class="foods-title">✅ Eat More</div><div class="food-tags">`;
    parsed.eatMore.forEach(f=>{html+=`<span class="food-tag">${f}</span>`;});
    html+=`</div></div>`;
  }

  if(parsed.avoid.length>0){
    html+=`<div class="card slide-up"><div class="foods-title" style="color:var(--red)">❌ Avoid</div><div class="food-tags">`;
    parsed.avoid.forEach(f=>{html+=`<span class="food-tag avoid">${f}</span>`;});
    html+=`</div></div>`;
  }

  if(parsed.tips.length>0){
    html+=`<div class="card slide-up"><div class="meal-section-title" style="color:var(--green)">💡 Tips for ${bodyType.type}</div>`;
    parsed.tips.forEach((tip,i)=>{html+=`<div class="meal-item"><div class="meal-foods">${i+1}. ${tip}</div></div>`;});
    html+=`</div>`;
  }

  html+=`
    <div class="lock-note"><strong>🔒 One analysis per day.</strong> Your diet plan resets tomorrow. Stay consistent with your ${goal} goal!</div>
    <button class="btn-next" onclick="goTo('meal.html')">Continue to Meal Planner →</button>`;
  return html;
}
</script>

<script>
// ✅ PAGE TRANSITION
window.addEventListener("DOMContentLoaded", () => {
  const pt = document.getElementById("pageTransition");
  if (pt) requestAnimationFrame(() => pt.classList.remove("enter"));
});

document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if (!link) return;
  const href = link.getAttribute("href");
  if (!href || href.startsWith("#") || href.startsWith("http") || href.startsWith("javascript:")) return;
  e.preventDefault();
  const pt = document.getElementById("pageTransition");
  if (pt) {
    pt.classList.remove("exit");
    pt.classList.add("enter");
    setTimeout(() => { window.location.href = href; }, 450);
  } else {
    window.location.href = href;
  }
});

window.goTo = function(href) {
  const pt = document.getElementById("pageTransition");
  if (pt) {
    pt.classList.remove("exit");
    pt.classList.add("enter");
    setTimeout(() => { window.location.href = href; }, 450);
  } else {
    window.location.href = href;
  }
};
</script>
</body>
</html>
