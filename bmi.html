<!DOCTYPE html>
<html>
<head>
    <title>BMI - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
<div class="card">

<h2 id="username"></h2>

<h1>💪 BMI Calculator</h1>
<p id="modeText" style="opacity:0.7;"></p>

<input type="number" id="weight" placeholder="Weight (kg)">
<input type="number" id="height" placeholder="Height (cm)">
<input type="number" id="target" placeholder="Target weight (kg)">

<button class="primary-btn" onclick="calculateBMI()">Calculate BMI</button>

<button class="secondary-btn" onclick="window.location.href='index.html'">
⬅ Go Home
</button>

<button class="secondary-btn" onclick="logout()">
Logout 🚪
</button>

<hr style="margin:20px 0; border:0.5px solid #333;">

<h2 id="result"></h2>
<h3 id="suggestion"></h3>
<h3 id="diet"></h3>
<h3 id="workout"></h3>
<h3 id="caloriesText"></h3>

<button id="nextBtn" class="primary-btn" style="display:none;">
Next ➡ Dashboard
</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let userName = localStorage.getItem("username") || "User";

if(userName.includes("@")){
    userName = userName.split("@")[0];
    localStorage.setItem("username", userName);
}

document.getElementById("username").innerText =
"Welcome, " + userName + " 💪";

// MODE CHECK
let hasData = localStorage.getItem("height");

if(hasData){
    document.getElementById("modeText").innerText =
    "Update your weight only 🔄";

    document.getElementById("height").style.display = "none";
    document.getElementById("target").style.display = "none";

    document.getElementById("weight").value =
    localStorage.getItem("weight") || "";

}else{
    document.getElementById("modeText").innerText =
    "Enter your details to get started";
}

// AUTH
let currentUser = null;

onAuthStateChanged(auth, (user)=>{
    if(user){
        currentUser = user;
    }else{
        window.location.href="login.html";
    }
});

// MAIN
window.calculateBMI = async function(){

    let weight = Number(document.getElementById("weight").value);

    let heightCm = localStorage.getItem("height")
    ? Number(localStorage.getItem("height"))
    : Number(document.getElementById("height").value);

    let target = localStorage.getItem("targetWeight")
    ? Number(localStorage.getItem("targetWeight"))
    : Number(document.getElementById("target").value);

    if(!weight || !heightCm || !target){
        alert("Enter valid details ⚠️");
        return;
    }

    // FIRST SAVE
    if(!localStorage.getItem("height")){
        localStorage.setItem("height", heightCm);
        localStorage.setItem("targetWeight", target);
        localStorage.setItem("startWeight", weight);
    }

    let height = heightCm / 100;
    let bmi = (weight / (height * height)).toFixed(2);

    // ELITE CALCULATIONS
    let minWeight = (18.5 * height * height).toFixed(1);
    let maxWeight = (24.9 * height * height).toFixed(1);
    let aesthetic = (22 * height * height).toFixed(1);

    let goal="", suggestion="", diet="", workout="", type="", advice="";

    if(bmi < 18.5){
        goal="bulk";
        suggestion="Underweight 🥲";
        diet="Eat more calories 🍗🥛";
        workout="Strength training 💪";
        type="Lean Build ⚡";

        let need=(minWeight-weight).toFixed(1);
        advice="Gain " + need + " kg for healthy zone 💪";
    }
    else if(bmi < 25){
        goal="maintain";
        suggestion="Fit 🔥";
        diet="Balanced diet 🍚🥗";
        workout="Maintain training 🏋️";
        type="Athletic / Fit 😈";
        advice="Perfect Fitness Zone 🔥";
    }
    else{
        goal="cut";
        suggestion="Overweight ⚠️";
        diet="Calorie deficit 🥗";
        workout="Cardio + fat loss 🏃";
        type="Heavy Build 🦍";

        let need=(weight-maxWeight).toFixed(1);
        advice="Lose " + need + " kg for healthy zone 🏃";
    }

    // CALORIES
    let maintain = Math.round(weight * 30);
    let bulk = maintain + 400;
    let cut = maintain - 400;

    let calories =
    goal==="bulk" ? bulk :
    goal==="maintain" ? maintain :
    cut;

    // RESULT
    document.getElementById("result").innerText =
`🔥 BMI: ${bmi}

💠 Body Type: ${type}

⚖ Ideal Weight:
${minWeight}kg - ${maxWeight}kg

😈 Aesthetic Weight:
${aesthetic} kg

${advice}`;

    document.getElementById("suggestion").innerText = suggestion;
    document.getElementById("diet").innerText = "Diet: " + diet;
    document.getElementById("workout").innerText = "Workout: " + workout;

    document.getElementById("caloriesText").innerText =
`🍚 Maintain: ${maintain} kcal
💪 Bulk: ${bulk} kcal
✂ Cut: ${cut} kcal

👉 Recommended: ${calories} kcal`;

    // SAVE
    localStorage.setItem("weight", weight);
    localStorage.setItem("bmi", bmi);
    localStorage.setItem("calories", calories);
    localStorage.setItem("goal", goal);

    document.getElementById("nextBtn").style.display="block";

    // FIRESTORE
    if(currentUser){
        try{
            let today = new Date().toISOString().split("T")[0];

            await setDoc(
                doc(db,"users",currentUser.uid,"daily",today),
                {
                    bmi:Number(bmi),
                    weight:weight,
                    calories:calories,
                    goal:goal,
                    date:today
                }
            );

        }catch(err){
            console.error(err);
        }
    }
}

// NEXT
document.getElementById("nextBtn").onclick=()=>{
    window.location.href="dashboard.html";
}

// LOGOUT
window.logout=()=>{
    localStorage.clear();
    window.location.href="login.html";
}

</script>

</body>
</html>
