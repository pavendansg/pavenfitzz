<!DOCTYPE html>
<html>
<head>
    <title>BMI - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
    <div class="card">

        <h2 id="username"></h2>

        <h1>💪 BMI Calculator</h1>
        <p style="opacity:0.7;">Enter your details to get started</p>

        <input type="number" id="weight" placeholder="Weight (kg)">
        <input type="number" id="height" placeholder="Height (cm)">

        <button id="bmiBtn" class="primary-btn">Calculate BMI</button>

        <button class="secondary-btn" onclick="window.location.href='index.html'">
            ⬅ Go Home
        </button>

        <button class="secondary-btn" onclick="logout()">
            Logout 🚪
        </button>

        <hr style="margin:20px 0; border:0.5px solid #333;">

        <h2 id="result"></h2>
        <h3 id="suggestion"></h3>
        <h3 id="diet"></h3>
        <h3 id="workout"></h3>

        <button id="nextBtn" class="primary-btn" style="display:none;">
            Next ➡ Dashboard
        </button>

    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// 🔥 PUT YOUR REAL CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07",
  storageBucket: "evolvefit-07.firebasestorage.app",
  messagingSenderId: "977676324550",
  appId: "1:977676324550:web:a09fb4dfea6c38190851c7",
  measurementId: "G-G5KYXR7CDH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔥 USER CHECK
let userName = localStorage.getItem("username");

if(!userName){
    window.location.href = "login.html";
}

document.getElementById("username").innerText = "Welcome, " + userName + " 💪";

// 🔥 AUTO FILL
document.getElementById("weight").value = localStorage.getItem("weight") || "";
document.getElementById("height").value = localStorage.getItem("height") || "";

// 🔥 STORE CURRENT USER
let currentUser = null;

onAuthStateChanged(auth, (user) => {
    if(user){
        currentUser = user;
    } else {
        window.location.href = "login.html";
    }
});

// 🔥 MAIN FUNCTION
async function calculateBMI() {

    let weight = Number(document.getElementById("weight").value);
    let heightCm = Number(document.getElementById("height").value);

    if(!weight || !heightCm){
        alert("Enter valid details ⚠️");
        return;
    }

    let height = heightCm / 100;
    let bmi = (weight / (height * height)).toFixed(2);

    document.getElementById("result").innerText = "Your BMI: " + bmi;

    let suggestion="", diet="", workout="", goal="";

    if(bmi < 18.5){
        suggestion="Underweight 🥲";
        diet="Eat more calories 🍗🥛";
        workout="Strength training 💪";
        goal="bulk";
    }
    else if(bmi < 25){
        suggestion="Fit 🔥";
        diet="Balanced diet 🍚🥗";
        workout="Maintain training 🏋️";
        goal="maintain";
    }
    else{
        suggestion="Overweight ⚠️";
        diet="Calorie deficit 🥗";
        workout="Cardio + fat loss 🏃";
        goal="cut";
    }

    document.getElementById("suggestion").innerText = suggestion;
    document.getElementById("diet").innerText = "Diet: " + diet;
    document.getElementById("workout").innerText = "Workout: " + workout;

    let calories = 0;
    if(goal === "bulk") calories = weight * 40;
    else if(goal === "maintain") calories = weight * 30;
    else calories = weight * 25;

    calories = Math.round(calories);

    // SAVE LOCAL
    localStorage.setItem("weight", weight);
    localStorage.setItem("height", heightCm);
    localStorage.setItem("bmi", bmi);
    localStorage.setItem("calories", calories);
    localStorage.setItem("goal", goal);

    // SHOW BUTTON
    document.getElementById("nextBtn").style.display = "block";

    // 🔥 SAVE FIREBASE (FINAL FIX)
    const user = auth.currentUser;

if(!user){
    alert("Wait 1 second and try again ⚠️");
    return;
}

try{
    await addDoc(collection(db, "users"), {
        uid: user.uid,
        bmi: Number(bmi),
        calories: calories,
        goal: goal,
        date: new Date().toISOString().split("T")[0]
    });

    console.log("Saved to Firebase ✅");
}catch(err){
    console.error(err);
}
// 🔥 BUTTON EVENTS
document.getElementById("bmiBtn").addEventListener("click", calculateBMI);

document.getElementById("nextBtn").addEventListener("click", () => {
    window.location.href = "dashboard.html";
});

// 🔥 LOGOUT
window.logout = function(){
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
