<!DOCTYPE html>
<html>
<head>
    <title>BMI - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
    <div class="card">

        <!-- 🔥 USERNAME -->
        <h2 id="username"></h2>

        <h1>💪 BMI Calculator</h1>
        <p style="opacity:0.7;">Enter your details to get started</p>

        <input type="number" id="weight" placeholder="Weight (kg)">
        <input type="number" id="height" placeholder="Height (cm)">

        <button class="primary-btn" onclick="calculateBMI()">Calculate BMI</button>

        <button class="secondary-btn" onclick="window.location.href='index.html'">
            ⬅ Go Home
        </button>

        <!-- 🔥 LOGOUT -->
        <button class="secondary-btn" onclick="logout()">
            Logout 🚪
        </button>

        <hr style="margin:20px 0; border:0.5px solid #333;">

        <h2 id="result"></h2>
        <h3 id="suggestion"></h3>

        <h3 id="diet"></h3>
        <h3 id="workout"></h3>

    </div>
</div>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

// 🔥 YOUR CONFIG (KEEP YOUR ORIGINAL VALUES)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "evolvefit-07",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔥 BMI FUNCTION
window.calculateBMI = async function() {

    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value / 100;

    if(!weight || !height){
        alert("Enter valid details bro ⚠️");
        return;
    }

    let bmi = weight / (height * height);
    bmi = bmi.toFixed(2);

    document.getElementById("result").innerText = "Your BMI: " + bmi;

    // 🔥 BASIC CALORIES (simple logic)
    let calories = Math.round(weight * 35);

    // SAVE LOCAL
    localStorage.setItem("weight", weight);
    localStorage.setItem("height", height * 100);
    localStorage.setItem("bmi", bmi);
    localStorage.setItem("calories", calories);

    // 🔥 SAVE TO FIREBASE
    const user = auth.currentUser;

    if(user){
        try {
            await addDoc(collection(db, "users"), {
                uid: user.uid,
                bmi: Number(bmi),
                calories: calories,
                date: new Date().toLocaleDateString()
            });

            console.log("Saved to Firebase ✅");
        } catch(err){
            console.error(err);
        }
    }
}

// 🔥 USER CHECK
let user = localStorage.getItem("username");

if(!user){
    window.location.href = "login.html";
}

document.getElementById("username").innerText = "Welcome, " + user + " 💪";

// 🔥 AUTO FILL
document.getElementById("weight").value = localStorage.getItem("weight") || "";
document.getElementById("height").value = localStorage.getItem("height") || "";

// 🔥 LOGOUT
window.logout = function(){
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
