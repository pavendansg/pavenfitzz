<!DOCTYPE html>
<html>
<head>
    <title>EvolveFit Check-In</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
<div class="card">

<h2 id="username"></h2>

<h1 id="mainTitle">💪 BMI Setup</h1>
<p id="modeText" style="opacity:0.8; margin-bottom:18px;"></p>

<input type="number" id="weight" placeholder="Weight (kg)">
<input type="number" id="height" placeholder="Height (cm)">
<input type="number" id="target" placeholder="Target weight (kg)">

<button class="primary-btn" onclick="calculateBMI()" id="mainBtn">
Start Journey 🚀
</button>

<button class="secondary-btn" onclick="window.location.href='index.html'">
⬅ Go Home
</button>

<button class="secondary-btn" onclick="logout()">
Logout 🚪
</button>

<hr style="margin:22px 0; border:0.5px solid #333;">

<h2 id="result"></h2>
<h3 id="suggestion"></h3>
<h3 id="diet"></h3>
<h3 id="workout"></h3>
<h3 id="caloriesText"></h3>

<button id="nextBtn" class="primary-btn" style="display:none;">
Go Dashboard ➜
</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// USER
let userName = localStorage.getItem("username") || "User";

document.getElementById("username").innerText =
"Welcome, " + userName + " 💪";

// MODE
let updateMode = false;

if(localStorage.getItem("height") && localStorage.getItem("targetWeight")){

    updateMode = true;

    document.getElementById("mainTitle").innerText =
    "📝 Daily Check-In";

    document.getElementById("modeText").innerText =
    "Update today's weight & track progress 🔥";

    document.getElementById("mainBtn").innerText =
    "Save Check-In ✅";

    document.getElementById("height").style.display = "none";
    document.getElementById("target").style.display = "none";

    document.getElementById("weight").placeholder =
    "Enter today's weight (kg)";

    document.getElementById("weight").value =
    localStorage.getItem("weight") || "";

}else{

    document.getElementById("modeText").innerText =
    "Enter your details to begin transformation 🚀";
}

// AUTH
let currentUser = null;

onAuthStateChanged(auth,(user)=>{
    if(user){
        currentUser = user;
    }else{
        location.href="login.html";
    }
});

// MAIN
window.calculateBMI = async function(){

    let weight = Number(document.getElementById("weight").value);

    let heightCm = updateMode
    ? Number(localStorage.getItem("height"))
    : Number(document.getElementById("height").value);

    let target = updateMode
    ? Number(localStorage.getItem("targetWeight"))
    : Number(document.getElementById("target").value);

    if(!weight || !heightCm || !target){
        alert("Enter valid details ⚠️");
        return;
    }

    // first setup save
    if(!updateMode){
        localStorage.setItem("height", heightCm);
        localStorage.setItem("targetWeight", target);
        localStorage.setItem("startWeight", weight);
    }

    let h = heightCm / 100;
    let bmi = (weight / (h*h)).toFixed(2);

    let goal = "";
    let suggestion = "";

    if(bmi < 18.5){
        goal = "bulk";
        suggestion = "Underweight 🥲";
    }
    else if(bmi < 25){
        goal = "maintain";
        suggestion = "Fit 🔥";
    }
    else{
        goal = "cut";
        suggestion = "Overweight ⚠️";
    }

    let calories = Math.round(weight * 30);

    // RESULT
    document.getElementById("result").innerText =
    updateMode
    ? "✔ Check-In Saved | BMI: " + bmi
    : "Your BMI: " + bmi;

    document.getElementById("suggestion").innerText =
    suggestion;

    document.getElementById("diet").innerText =
    "Healthy BMI Range: 18.5 - 24.9";

    document.getElementById("workout").innerText =
    "Ideal Weight: " +
    (18.5*h*h).toFixed(1) + "kg - " +
    (24.9*h*h).toFixed(1) + "kg";

    document.getElementById("caloriesText").innerText =
    "Recommended Calories: " + calories + " kcal";

    // SAVE LOCAL
    localStorage.setItem("weight", weight);
    localStorage.setItem("bmi", bmi);
    localStorage.setItem("goal", goal);
    localStorage.setItem("calories", calories);

    document.getElementById("nextBtn").style.display = "block";

    // FIREBASE SAVE
    if(currentUser){

        let today = new Date().toISOString().split("T")[0];

        await setDoc(
            doc(db,"users",currentUser.uid,"daily",today),
            {
                bmi:Number(bmi),
                weight:weight,
                calories:calories,
                goal:goal,
                date:today
            }
        );
    }

    // AUTO RETURN IF CHECK-IN
    if(updateMode){
        setTimeout(()=>{
            location.href="dashboard.html";
        },1500);
    }
}

// NEXT
document.getElementById("nextBtn").onclick = ()=>{
    location.href="dashboard.html";
}

// LOGOUT
window.logout = function(){
    localStorage.clear();
    location.href="login.html";
}

</script>

</body>
</html>
