<!DOCTYPE html>
<html>
<head>
    <title>BMI - EvolveFit Club</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container">
    <div class="card">

        <!-- 🔥 USERNAME -->
        <h2 id="username"></h2>

        <h1>💪 BMI Calculator</h1>
        <p style="opacity:0.7;">Enter your details to get started</p>

        <input type="number" id="weight" placeholder="Weight (kg)">
        <input type="number" id="height" placeholder="Height (cm)">

        <button class="primary-btn" onclick="calculateBMI()">Calculate BMI</button>

        <button class="secondary-btn" onclick="window.location.href='index.html'">
            ⬅ Go Home
        </button>

        <!-- 🔥 LOGOUT -->
        <button class="secondary-btn" onclick="logout()">
            Logout 🚪
        </button>

        <hr style="margin:20px 0; border:0.5px solid #333;">

        <h2 id="result"></h2>
        <h3 id="suggestion"></h3>

        <h3 id="diet"></h3>
        <h3 id="workout"></h3>

        <button id="calBtn" class="primary-btn" onclick="goToCalories()" style="display:none;">
            Next ➡ Calories 🔥
        </button>

    </div>
</div>

<script src="script.js"></script>

<script>

/* 🔥 PROTECTION */
let user = localStorage.getItem("username");

if(!user){
    window.location.href = "login.html";
}

/* 🔥 SHOW NAME */
document.getElementById("username").innerText = "Welcome, " + user + " 💪";

/* 🔥 AUTO FILL */
document.getElementById("weight").value = localStorage.getItem("weight") || "";
document.getElementById("height").value = localStorage.getItem("height") || "";

/* 🔥 LOGOUT */
function logout(){
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
