<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvolveFit — Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.header{text-align:center;margin-bottom:28px;}
.logo{font-size:44px;animation:logoBounce .9s var(--spring) .1s both;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;background:linear-gradient(90deg,var(--orange),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tagline{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:2px;}

.gen-btn{width:100%;padding:16px;border:none;border-radius:var(--r-md);margin-top:22px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--orange),var(--gold));color:#080808;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;transition:all .3s var(--spring);box-shadow:0 4px 20px rgba(240,112,64,0.2);}
.gen-btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(240,112,64,0.35);}
.gen-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

.result{margin-top:24px;}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.macro-card{background:var(--glass);backdrop-filter:var(--glass-blur-sm);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:12px;text-align:center;transition:all .25s var(--spring);}
.macro-card:hover{background:var(--glass-hover);transform:translateY(-2px);}
.macro-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;}
.macro-val.orange{color:var(--orange);}
.macro-val.green{color:var(--green);}
.macro-val.blue{color:var(--blue);}
.macro-val.gold{color:var(--gold);}
.macro-label{font-size:10px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

.meal-card{border-left:3px solid var(--orange);}
.meal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.meal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;color:var(--orange);}
.meal-cal{background:rgba(240,112,64,0.08);backdrop-filter:var(--glass-blur-sm);border:1px solid rgba(240,112,64,0.22);color:var(--orange);padding:3px 10px;border-radius:var(--r-full);font-size:11px;font-weight:700;font-family:var(--font-mono);}
.food-item{padding:7px 0;border-bottom:1px solid var(--glass-border);font-size:14px;color:#ccc;display:flex;gap:8px;align-items:flex-start;}
.food-item:last-child{border-bottom:none;}
.f-dot{width:5px;height:5px;background:var(--orange);border-radius:50%;margin-top:8px;flex-shrink:0;}

.day-note{background:var(--glass);backdrop-filter:var(--glass-blur-sm);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:11px 14px;margin-top:12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.day-note span{color:var(--green);font-weight:700;}
.locked-note{background:var(--glass);backdrop-filter:var(--glass-blur-sm);border:1px solid var(--glass-border);border-radius:var(--r-sm);padding:12px 14px;margin-top:14px;font-size:13px;color:var(--muted);line-height:1.7;}
.locked-note strong{color:var(--orange);}

.btn-home{width:100%;padding:15px;border:none;border-radius:var(--r-md);font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font-body);background:linear-gradient(135deg,var(--green),var(--blue));color:#080808;margin-top:14px;transition:all .3s var(--spring);box-shadow:0 4px 20px rgba(0,255,136,0.2);}
.btn-home:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,255,136,0.35);}

.error-box{background:rgba(240,69,69,0.06);color:#f07070;padding:16px;border-radius:var(--r-md);margin-top:14px;border:1px solid rgba(240,69,69,0.2);font-size:14px;backdrop-filter:var(--glass-blur-sm);animation:shake .4s var(--spring);}

.locked-banner{background:linear-gradient(135deg,rgba(240,112,64,0.06),rgba(240,112,64,0.02));backdrop-filter:var(--glass-blur);border:1px solid rgba(240,112,64,0.18);border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.locked-banner strong{color:var(--orange);}
.locked-banner p{font-size:13px;color:#aaa;line-height:1.6;}

@media(max-width:600px){ .macro-row{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<div id="pageTransition" class="enter"></div>

<div class="wrap">
  <div class="header slide-up">
    <div class="logo">🍗</div>
    <div class="brand">Meal Planner</div>
    <div class="tagline">DAILY MEAL PLAN FROM YOUR FOODS</div>
  </div>
  <div class="nav slide-up stagger-1">
    <a href="workout.html">💪 Workout</a>
    <a href="diet.html">🧬 Diet</a>
    <a href="meal.html" class="active">🍗 Meal</a>
    <a href="dashboard-premium.html">🏠 Dashboard</a>
  </div>

  <div id="mainContent">
    <div class="hint-box slide-up stagger-2">
      💡 <strong>Tip:</strong> Enter the foods you have at home. AI generates a full day plan with calories and protein using only those foods.
    </div>
    <div class="card slide-up stagger-3">
      <label class="input-label">Foods You Have</label>
      <textarea id="foods" placeholder="e.g. eggs, rice, dal, oats, banana, chicken, curd..."></textarea>
      <label class="input-label">Number of Meals</label>
      <select id="meals">
        <option value="4">4 Meals (Breakfast · Lunch · Snack · Dinner)</option>
        <option value="5">5 Meals (+ Pre-Workout)</option>
        <option value="6">6 Meals (+ Pre + Post Workout)</option>
      </select>
      <button class="gen-btn" id="genBtn" onclick="generateMeal()">Generate Meal Plan 🍗</button>
    </div>
    <div id="mealResult" class="result"></div>
  </div>
</div>

<script>
if (localStorage.getItem("premium") !== "true") { location.href = "payment.html"; }
if (!localStorage.getItem("dietDate")) { location.href = "diet.html"; }

const WORKER = "https://pavenfitzz-ai.pavendansg.workers.dev/";
const goal   = localStorage.getItem("goal") || "Bulk";
const CALORIE_TARGETS = {Bulk:3000,Cut:1800,Maintain:2400,Athletic:2600};
const PROTEIN_TARGETS = {Bulk:140, Cut:160, Maintain:120, Athletic:150};

window.onload = function() {
  const budgetFoods = localStorage.getItem("budgetFoods");
  if(budgetFoods) document.getElementById("foods").value = budgetFoods;
  const savedMeal = localStorage.getItem("mealData");
  const savedDate = localStorage.getItem("mealDate");
  if(savedMeal && savedDate === new Date().toDateString()){
    document.getElementById("mainContent").innerHTML =
      `<div class="locked-banner"><div style="font-size:24px;">🔒</div>
      <div><strong>Today's Meal Plan Ready</strong><p>Generated once per day. Come back tomorrow for a fresh plan.</p></div></div>`
      + renderMealHTML(JSON.parse(savedMeal));
  }
};

async function generateMeal() {
  const foods = document.getElementById("foods").value.trim();
  const meals = document.getElementById("meals").value;
  const btn   = document.getElementById("genBtn");
  if(!foods){ alert("⚠️ Enter the foods you have!"); return; }

  btn.disabled = true;
  document.getElementById("mealResult").innerHTML =
    `<div class="loading">🍳 Creating Your Meal Plan<div class="dots"><span></span><span></span><span></span></div></div>`;

  const calTarget  = CALORIE_TARGETS[goal] || 2500;
  const protTarget = PROTEIN_TARGETS[goal] || 130;
  const mealNames  = meals==4
    ? "Breakfast, Lunch, Snack, Dinner"
    : meals==5
    ? "Breakfast, Lunch, Snack, Pre-Workout, Dinner"
    : "Breakfast, Lunch, Snack, Pre-Workout, Post-Workout, Dinner";

  const prompt = `Indian fitness meal planner. Goal: ${goal}. Target: ${calTarget}cal, ${protTarget}g protein.
Available foods: ${foods}.
Create ${meals} meals: ${mealNames}.
Use ONLY the listed foods. Indian style. Keep it short and clear.
FORMAT:
BREAKFAST — 350cal | 25g P
- 3 Eggs scrambled
- 1 cup Oats with banana
LUNCH — 500cal | 40g P
- 150g Chicken curry
- 1 cup Rice
[continue for all meals]
DAILY TOTAL:
Calories: Xkcal | Protein: Xg | Carbs: Xg | Fat: Xg
No extra text. Only meals and totals.`;

  try {
    const res  = await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
    const data = await res.json();
    const text = data.text||"";
    if(!text) throw new Error("No response");
    const parsed = parseMeal(text);
    localStorage.setItem("mealData", JSON.stringify(parsed));
    localStorage.setItem("mealDate", new Date().toDateString());
    // ✅ KEY FIX — set ai_setup_done so dashboard-premium unlocks
    localStorage.setItem("ai_setup_done", "true");
    document.getElementById("mealResult").innerHTML = renderMealHTML(parsed);
  } catch(err) {
    document.getElementById("mealResult").innerHTML = `<div class="error-box">⚠️ ${err.message}</div>`;
  }
  btn.disabled = false;
}

function parseMeal(text) {
  const lines   = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const meals   = [];
  const totals  = {};
  let current   = null;
  const mealKW  = /^(breakfast|lunch|snack|dinner|pre-workout|post-workout|pre workout|post workout)/i;
  lines.forEach(line => {
    if(line.match(/^daily total/i)){ current=null; return; }
    if(line.match(/^calories/i)&&!current){ const m=line.match(/(\d+)/); if(m) totals.cal=m[1]; return; }
    if(line.match(/^protein/i) &&!current){ const m=line.match(/(\d+)/); if(m) totals.prot=m[1]; return; }
    if(line.match(/^carbs/i)   &&!current){ const m=line.match(/(\d+)/); if(m) totals.carbs=m[1]; return; }
    if(line.match(/^fat/i)     &&!current){ const m=line.match(/(\d+)/); if(m) totals.fat=m[1]; return; }
    if(line.match(mealKW)){
      if(current) meals.push(current);
      const calM=line.match(/(\d+)cal/i), protM=line.match(/(\d+)g\s*P/i);
      current={title:line.split("—")[0].split("|")[0].trim(), cal:calM?.[1]||"", prot:protM?.[1]||"", items:[]};
    } else if(current&&line.match(/^[•\-]/)) current.items.push(line.replace(/^[•\-]\s*/,""));
  });
  if(current) meals.push(current);
  return {meals,totals};
}

function renderMealHTML(data) {
  const calTarget  = CALORIE_TARGETS[goal]||2500;
  const protTarget = PROTEIN_TARGETS[goal]||130;
  const mealEmojis = {breakfast:"🌅",lunch:"☀️",snack:"⚡",dinner:"🌙","pre-workout":"💪","post-workout":"🔄"};

  let html = `<div class="macro-row">
    <div class="macro-card"><div class="macro-val orange">${data.totals.cal||calTarget}</div><div class="macro-label">Calories</div></div>
    <div class="macro-card"><div class="macro-val green">${data.totals.prot||protTarget}g</div><div class="macro-label">Protein</div></div>
    <div class="macro-card"><div class="macro-val blue">${data.totals.carbs||"—"}g</div><div class="macro-label">Carbs</div></div>
    <div class="macro-card"><div class="macro-val gold">${data.totals.fat||"—"}g</div><div class="macro-label">Fat</div></div>
  </div>`;

  data.meals.forEach(meal=>{
    const key  =Object.keys(mealEmojis).find(k=>meal.title.toLowerCase().includes(k));
    const emoji=key?mealEmojis[key]:"🍽️";
    html+=`<div class="card meal-card slide-up">
      <div class="meal-header">
        <div class="meal-title">${emoji} ${meal.title}</div>
        ${meal.cal?`<div class="meal-cal">${meal.cal}kcal${meal.prot?" · "+meal.prot+"g P":""}</div>`:""}
      </div>
      ${meal.items.map(item=>`<div class="food-item"><div class="f-dot"></div><span>${item}</span></div>`).join("")}
    </div>`;
  });

  html+=`
    <div class="day-note">Today's plan · Resets tomorrow <span>📅 ${new Date().toDateString()}</span></div>
    <div class="locked-note"><strong>✅ One plan per day.</strong> Stay consistent with your goal: ${goal}. Prep meals in advance for best results.</div>
    <button class="btn-home" onclick="goTo('dashboard-premium.html')">Go to Dashboard 🏠</button>`;
  return html;
}
</script>

<script>
// ✅ PAGE TRANSITION
window.addEventListener("DOMContentLoaded", () => {
  const pt = document.getElementById("pageTransition");
  if (pt) requestAnimationFrame(() => pt.classList.remove("enter"));
});

document.addEventListener("click", (e) => {
  const link = e.target.closest("a[href]");
  if (!link) return;
  const href = link.getAttribute("href");
  if (!href || href.startsWith("#") || href.startsWith("http") || href.startsWith("javascript:")) return;
  e.preventDefault();
  const pt = document.getElementById("pageTransition");
  if (pt) {
    pt.classList.remove("exit");
    pt.classList.add("enter");
    setTimeout(() => { window.location.href = href; }, 450);
  } else {
    window.location.href = href;
  }
});

window.goTo = function(href) {
  const pt = document.getElementById("pageTransition");
  if (pt) {
    pt.classList.remove("exit");
    pt.classList.add("enter");
    setTimeout(() => { window.location.href = href; }, 450);
  } else {
    window.location.href = href;
  }
};
</script>
</body>
</html>
