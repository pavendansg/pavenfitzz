<!DOCTYPE html>
<html>
<head>
<title>Calories - EvolveFit</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="container">
<div class="card">

  <div style="text-align:center;margin-bottom:20px;">
    <h1>🔥 Calorie Calculator</h1>
    <p style="opacity:.7;font-size:14px;">Find your perfect daily calorie target</p>
  </div>

  <div class="info-pill" id="info"></div>

  <label class="input-label">Height (cm)</label>
  <input type="number" id="height" placeholder="e.g. 175">

  <label class="input-label">Age</label>
  <input type="number" id="age" placeholder="e.g. 22">

  <label class="input-label">Gender</label>
  <select id="gender">
    <option value="male">Male 👨</option>
    <option value="female">Female 👩</option>
  </select>

  <label class="input-label">Your Goal</label>
  <select id="goal">
    <option value="bulk">Bulk 💪 — Build Muscle</option>
    <option value="maintain">Maintain ⚖️ — Stay Lean</option>
    <option value="cut">Cut 🔥 — Lose Fat</option>
  </select>

  <button class="primary-btn" onclick="calculateCalories()" style="margin-top:20px;">
    Calculate My Calories ⚡
  </button>

  <div class="result-box" id="resultBox" style="display:none;">
    <p style="opacity:.6;font-size:13px;margin-bottom:4px;">Your Daily Target</p>
    <h2 id="result"></h2>
    <p id="extra" style="margin-top:8px;"></p>
  </div>

  <button id="nextBtn" class="primary-btn" onclick="goToMacros()" style="display:none;margin-top:10px;">
    Next → View My Macros 🍗
  </button>

  <button class="secondary-btn" onclick="location.href='dashboard.html'" style="margin-top:8px;">
    ← Back to Dashboard
  </button>

</div>
</div>
<script src="script.js"></script>
<script>
// show result box when result is filled
const origCalc = calculateCalories;
calculateCalories = function() {
  origCalc();
  const rb = document.getElementById("resultBox");
  if (localStorage.getItem("calories")) rb.style.display = "block";
};
</script>
</body>
</html>
