<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 70% 60% at 20% 30%,rgba(200,245,66,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(200,245,66,0.04) 0%,transparent 55%),#080808;}
.login-card{width:100%;max-width:400px;background:#111110;border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:40px 32px;text-align:center;animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.login-logo{width:64px;height:64px;border-radius:50%;background:rgba(200,245,66,0.1);border:1.5px solid rgba(200,245,66,0.25);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;}
.login-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#f0ede6;letter-spacing:-0.5px;margin-bottom:6px;}
.login-title em{color:#c8f542;font-style:normal}
.login-sub{font-size:14px;color:#6b6b5a;margin-bottom:28px;font-family:'DM Sans',sans-serif}

/* TABS */
.auth-tabs{display:flex;gap:0;background:#0d0d0b;border-radius:12px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;padding:9px;border:none;border-radius:9px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;background:transparent;color:#6b6b5a;transition:all .2s;}
.auth-tab.active{background:#c8f542;color:#080808;}

/* PANELS */
.auth-panel{display:none;}
.auth-panel.active{display:block;}

/* INPUT */
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#6b6b5a;font-family:'DM Sans',sans-serif;margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;background:#161615;border:1px solid rgba(255,255,255,0.07);border-radius:12px;color:#f0ede6;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
.field input:focus{border-color:rgba(200,245,66,0.35);}
.field input::placeholder{color:#3a3a30;}

/* BUTTONS */
.action-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:800;font-family:'Syne',sans-serif;cursor:pointer;background:#c8f542;color:#080808;margin-top:4px;transition:all .2s;}
.action-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(200,245,66,0.25);}
.action-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.divider{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:12px;color:#3a3a30;font-family:'DM Sans',sans-serif;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06);}

.google-btn{width:100%;padding:13px 20px;background:#1a1a18;color:#f0ede6;border:1px solid rgba(255,255,255,0.1);border-radius:14px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .2s;}
.google-btn:hover{border-color:rgba(200,245,66,0.3);background:#1e1e1c;}
.google-btn:disabled{opacity:.5;cursor:not-allowed;}
.google-icon{width:18px;height:18px;flex-shrink:0;}

#msg{font-size:13px;margin-top:12px;min-height:18px;font-family:'DM Sans',sans-serif;}
#msg.err{color:#f04545;}
#msg.ok{color:#c8f542;}
.login-fine{font-size:11px;color:#3a3a30;margin-top:20px;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <div class="login-title">Evolve<em>Fit</em></div>
    <p class="login-sub">Your elite fitness journey starts here</p>

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- LOGIN PANEL -->
    <div class="auth-panel active" id="panel-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password"/>
      </div>
      <button class="action-btn" id="loginBtn" onclick="emailLogin()">Login →</button>
      <div class="divider">or</div>
      <button class="google-btn" id="googleLoginBtn" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- SIGNUP PANEL -->
    <div class="auth-panel" id="panel-signup">
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="signup-name" placeholder="e.g. Pavendan"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@email.com"/>
      </div>
      <div class="field">
        <label>Password (your choice)</label>
        <input type="password" id="signup-password" placeholder="Min 6 characters"/>
      </div>
      <button class="action-btn" id="signupBtn" onclick="emailSignup()">Create Account →</button>
      <div class="divider">or</div>
      <button class="google-btn" id="googleSignupBtn" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign up with Google
      </button>
    </div>

    <div id="msg"></div>
    <p class="login-fine">By continuing you agree to our Terms & Privacy Policy</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  updateProfile, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();

// ── TAB SWITCHER ──
window.switchTab = function(tab) {
  document.querySelectorAll(".auth-tab").forEach((t,i)=>t.classList.toggle("active", (tab==="login"?i===0:i===1)));
  document.getElementById("panel-login").classList.toggle("active", tab==="login");
  document.getElementById("panel-signup").classList.toggle("active", tab==="signup");
  document.getElementById("msg").innerText = "";
};

function showMsg(text, type="err") {
  const el = document.getElementById("msg");
  el.innerText = text;
  el.className = type;
}

// ── AFTER LOGIN: check premium + redirect ──
async function afterLogin(user) {
  localStorage.setItem("username", user.displayName || user.email.split("@")[0]);
  localStorage.setItem("photo", user.photoURL || "");
  localStorage.setItem("uid", user.uid);

  // ✅ Always restore premium from Firestore
  try {
    const premSnap = await getDoc(doc(db, "premium", user.uid));
    if (premSnap.exists() && premSnap.data().active === true) {
      localStorage.setItem("premium", "true");
      // ✅ Also restore ai_setup_done if they already paid & completed setup
      localStorage.setItem("ai_setup_done", "true");
    } else {
      localStorage.setItem("premium", "false");
    }
  } catch(e) { console.error("Premium check failed:", e); }

  const setupDone = localStorage.getItem("setup_done") === "true";
  if (!setupDone) {
    location.href = "setup.html";
  } else if (localStorage.getItem("premium") === "true") {
    location.href = "dashboard-premium.html";
  } else {
    location.href = "bmi.html";
  }
}

// ── GOOGLE LOGIN ──
window.googleLogin = function() {
  const btns = document.querySelectorAll(".google-btn");
  btns.forEach(b=>{b.disabled=true;});
  signInWithPopup(auth, provider)
    .then(result => afterLogin(result.user))
    .catch(err => {
      showMsg("Google login failed. Try again.");
      btns.forEach(b=>{b.disabled=false;});
    });
};

// ── EMAIL SIGN UP ──
window.emailSignup = function() {
  const name  = document.getElementById("signup-name").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const pass  = document.getElementById("signup-password").value;
  if (!name)  { showMsg("Please enter your name."); return; }
  if (!email) { showMsg("Please enter your email."); return; }
  if (pass.length < 6) { showMsg("Password must be at least 6 characters."); return; }

  const btn = document.getElementById("signupBtn");
  btn.disabled = true; btn.innerText = "Creating account...";

  createUserWithEmailAndPassword(auth, email, pass)
    .then(result => updateProfile(result.user, { displayName: name }).then(() => afterLogin(result.user)))
    .catch(err => {
      if (err.code === "auth/email-already-in-use") showMsg("Email already in use. Try logging in.");
      else if (err.code === "auth/invalid-email") showMsg("Invalid email address.");
      else showMsg("Signup failed: " + err.message);
      btn.disabled = false; btn.innerText = "Create Account →";
    });
};

// ── EMAIL LOGIN ──
window.emailLogin = function() {
  const email = document.getElementById("login-email").value.trim();
  const pass  = document.getElementById("login-password").value;
  if (!email) { showMsg("Please enter your email."); return; }
  if (!pass)  { showMsg("Please enter your password."); return; }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.innerText = "Logging in...";

  signInWithEmailAndPassword(auth, email, pass)
    .then(result => afterLogin(result.user))
    .catch(err => {
      if (err.code === "auth/user-not-found") showMsg("No account found. Create one first.");
      else if (err.code === "auth/wrong-password") showMsg("Wrong password. Try again.");
      else if (err.code === "auth/invalid-email") showMsg("Invalid email address.");
      else showMsg("Login failed: " + err.message);
      btn.disabled = false; btn.innerText = "Login →";
    });
};

// ── AUTO REDIRECT if already logged in ──
onAuthStateChanged(auth, async (user) => {
  if (user) await afterLogin(user);
});
</script>
</body>
</html>
