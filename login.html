<!DOCTYPE html>

<html>
<head>
    <title>Login - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<div class="card">

<h1>🔥 EvolveFit</h1>

<button class="primary-btn" onclick="googleLogin()">
    Continue with Google 🚀
</button>

<p id="msg"></p>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07",
  storageBucket: "evolvefit-07.firebasestorage.app",
  messagingSenderId: "977676324550",
  appId: "1:977676324550:web:a09fb4dfea6c38190851c7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// 🔥 AUTO LOGIN (skip login screen if already signed in)
onAuthStateChanged(auth, (user) => {
    if(user){
        localStorage.setItem("username", user.displayName);
        localStorage.setItem("photo", user.photoURL);
        window.location.href = "bmi.html";
    }
});

// 🔥 GOOGLE LOGIN FUNCTION
window.googleLogin = function(){

    signInWithPopup(auth, provider)
    .then((result) => {

        let user = result.user;

        // SAVE USER DATA
        localStorage.setItem("username", user.displayName);
        localStorage.setItem("photo", user.photoURL);

        window.location.href = "bmi.html";

    })
    .catch((error) => {
        document.getElementById("msg").innerText = error.message;
    });

}

</script>

</body>
</html>
