<!DOCTYPE html>

<html>
<head>
    <title>Login - EvolveFit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
<div class="card">

<h1>🔥 EvolveFit</h1>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button class="primary-btn" onclick="signup()">Sign Up</button> <button class="primary-btn" onclick="login()">Login</button>

<p id="msg"></p>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDZBcOjJQjrD1dkbvPH4U51fxbv3I0Jgww",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07",
  storageBucket: "evolvefit-07.firebasestorage.app",
  messagingSenderId: "977676324550",
  appId: "1:977676324550:web:a09fb4dfea6c38190851c7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 AUTO LOGIN (NO NEED LOGIN AGAIN)
onAuthStateChanged(auth, (user) => {
    if(user){
        window.location.href = "bmi.html";
    }
});

// SIGNUP
window.signup = function() {
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, pass)
    .then((userCredential) => {

        // 🔥 SAVE NAME (email → username)
        let name = email.split("@")[0];
        localStorage.setItem("username", name);

        document.getElementById("msg").innerText = "Signup success ✅";

    })
    .catch(err => {
        document.getElementById("msg").innerText = err.message;
    });
}

// LOGIN
window.login = function() {

    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, pass)
    .then((userCredential) => {

        // 🔥 SAVE NAME (email → username)
        let name = email.split("@")[0];
        localStorage.setItem("username", name);

        window.location.href = "bmi.html";

    })
    .catch(err => {
        document.getElementById("msg").innerText = err.message;
    });
}

</script>

</body>
</html>
