<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:
    radial-gradient(ellipse 70% 60% at 20% 30%, rgba(200,245,66,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(200,245,66,0.04) 0%, transparent 55%),
    #080808;
}
.login-card{
  width:100%;max-width:400px;
  background:#111110;border:1px solid rgba(255,255,255,0.06);
  border-radius:24px;padding:40px 32px;
  text-align:center;animation:fadeUp .45s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.login-logo{
  width:64px;height:64px;border-radius:50%;
  background:rgba(200,245,66,0.1);border:1.5px solid rgba(200,245,66,0.25);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 20px;
}
.login-title{
  font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
  color:#f0ede6;letter-spacing:-0.5px;margin-bottom:6px;
}
.login-title em{color:#c8f542;font-style:normal}
.login-sub{font-size:14px;color:#6b6b5a;margin-bottom:32px;font-family:'DM Sans',sans-serif}
.google-btn{
  width:100%;padding:14px 20px;
  background:#1a1a18;color:#f0ede6;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;
  transition:all .2s;
}
.google-btn:hover{border-color:rgba(200,245,66,0.3);background:#1e1e1c}
.google-btn:active{transform:scale(0.98)}
.google-btn:disabled{opacity:.5;cursor:not-allowed}
.google-icon{width:20px;height:20px;flex-shrink:0}
.login-fine{font-size:11px;color:#3a3a30;margin-top:20px;font-family:'DM Sans',sans-serif}
#msg{color:#f04545;font-size:13px;margin-top:12px;min-height:20px;font-family:'DM Sans',sans-serif}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <div class="login-title">Evolve<em>Fit</em></div>
    <p class="login-sub">Your elite fitness journey starts here</p>
    <button class="google-btn" id="googleBtn" onclick="googleLogin()">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
    <div id="msg"></div>
    <p class="login-fine">By continuing you agree to our Terms & Privacy Policy</p>
  </div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import{getAuth,signInWithPopup,GoogleAuthProvider,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",authDomain:"evolvefit-07.firebaseapp.com",projectId:"evolvefit-07"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();
  const db=getFirestore(app);

function goNext(){
  // If setup done → dashboard, else → setup
  if(localStorage.getItem("setup_done")==="true"){
    if(localStorage.getItem("premium")==="true"){
      location.href="dashboard-premium.html";
    } else {
      location.href="graph.html";
    }
  } else {
    location.href="setup.html";
  }
}

onAuthStateChanged(auth,u=>{
  if(u){
    localStorage.setItem("username",u.displayName||"User");
    localStorage.setItem("photo",u.photoURL||"");
    localStorage.setItem("uid",u.uid);
    goNext();
  }
});

window.googleLogin=function(){
  const btn=document.getElementById("googleBtn");
  btn.disabled=true;
  btn.innerHTML=`<svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Signing in...`;
  signInWithPopup(auth,provider).then(r=>{
    localStorage.setItem("username",r.user.displayName||"User");
    localStorage.setItem("photo",r.user.photoURL||"");
    localStorage.setItem("uid",r.user.uid);
    goNext();
  }).catch(e=>{
    document.getElementById("msg").innerText="Login failed. Try again.";
    btn.disabled=false;
    btn.innerHTML=`<svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Continue with Google`;
  });
};
</script>
</body>
</html>
