<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<title>Login - EvolveFit</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="container">
<div class="card" style="text-align:center;">
  <div class="logo-wrap">
    <span class="logo-icon">⚡</span>
  </div>
  <h1 style="font-size:32px;margin-bottom:6px;">EvolveFit</h1>
  <p style="opacity:.6;font-size:14px;margin-bottom:28px;">
    Your elite fitness journey starts here
  </p>
  <button class="primary-btn google-btn" onclick="googleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
         width="20" height="20" style="vertical-align:middle;margin-right:10px;">
    Continue with Google
  </button>
  
  <!-- Resend verification button -->
  <button class="secondary-btn" onclick="resendVerification()" style="margin-top:12px;">
    Resend Verification Email 📧
  </button>
  
  <p id="msg" style="color:#ff4444;margin-top:12px;font-size:13px;"></p>
  <p style="opacity:.4;font-size:12px;margin-top:24px;">
    By continuing you agree to our Terms & Privacy Policy
  </p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
  getAuth, signInWithPopup,
  GoogleAuthProvider, onAuthStateChanged,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07",
  storageBucket: "evolvefit-07.firebasestorage.app",
  messagingSenderId: "977676324550",
  appId: "1:977676324550:web:a09fb4dfea6c38190851c7"
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();

function goNext() {
  // Check if user came from AI Coach payment page
  const ref = document.referrer;
  const aiPaymentURL = "https://pavendansg.github.io/pavenfitzz-ai/payment.html";

  if (ref.includes("pavenfitzz-ai")) {
    location.href = aiPaymentURL;
    return;
  }

  // Normal EvolveFit flow
  if (localStorage.getItem("height") && localStorage.getItem("targetWeight")) {
    location.href = "dashboard.html";
  } else {
    location.href = "bmi.html";
  }
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    // ✅ EMAIL VERIFICATION CHECK
    if (!user.emailVerified) {
      document.getElementById("msg").innerHTML = "⚠️ Please verify your email. Check your inbox (and spam).";
      document.getElementById("msg").style.color = "#ffd700";
      auth.signOut();
      return;
    }
    localStorage.setItem("username", user.displayName || "User");
    localStorage.setItem("photo",    user.photoURL    || "");
    goNext();
  }
});

window.googleLogin = function() {
  const btn = document.querySelector(".google-btn");
  btn.innerHTML = "Signing in...";
  btn.disabled  = true;
  document.getElementById("msg").innerHTML = "";

  signInWithPopup(auth, provider)
    .then(async (result) => {
      const user = result.user;
      // If email not verified, send verification and sign out
      if (!user.emailVerified) {
        await sendEmailVerification(user);
        document.getElementById("msg").innerHTML = "📧 Verification email sent! Please verify and login again.";
        document.getElementById("msg").style.color = "#00ff88";
        await auth.signOut();
      } else {
        localStorage.setItem("username", user.displayName || "User");
        localStorage.setItem("photo",    user.photoURL    || "");
        goNext();
      }
    })
    .catch((err) => {
      document.getElementById("msg").innerHTML = "Login failed: " + err.message;
      document.getElementById("msg").style.color = "#ff4444";
    })
    .finally(() => {
      btn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        width="20" height="20" style="vertical-align:middle;margin-right:10px;">
        Continue with Google`;
      btn.disabled = false;
    });
};

// Resend verification button handler
window.resendVerification = async function() {
  const user = auth.currentUser;
  if (user && !user.emailVerified) {
    await sendEmailVerification(user);
    document.getElementById("msg").innerHTML = "✅ Verification email resent! Check your inbox.";
    document.getElementById("msg").style.color = "#00ff88";
  } else if (user && user.emailVerified) {
    document.getElementById("msg").innerHTML = "✅ Email already verified. Please login again.";
    document.getElementById("msg").style.color = "#00ff88";
  } else {
    document.getElementById("msg").innerHTML = "No user signed in. Click 'Continue with Google' first.";
    document.getElementById("msg").style.color = "#ff4444";
  }
};
</script>
</body>
</html>
