<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
/* ── BACKGROUND ── */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;
  background:#080808;
}
/* Animated radial orbs */
.login-wrap::before,.login-wrap::after{
  content:'';position:absolute;border-radius:50%;filter:blur(80px);
  animation:orbFloat 6s ease-in-out infinite;pointer-events:none;
}
.login-wrap::before{
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(200,245,66,0.08),transparent 70%);
  top:-100px;left:-100px;animation-delay:0s;
}
.login-wrap::after{
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(200,245,66,0.05),transparent 70%);
  bottom:-80px;right:-80px;animation-delay:-3s;
}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(30px,20px) scale(1.08);}
}

/* Particle dots */
.particle{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(200,245,66,0.4);pointer-events:none;
  animation:particleFloat linear infinite;
}
@keyframes particleFloat{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(-20px) scale(1);opacity:0;}
}

/* ── CARD ── */
.login-card{
  width:100%;max-width:420px;
  background:rgba(17,17,16,0.85);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:28px;padding:44px 36px;
  text-align:center;
  position:relative;z-index:2;
  animation:cardSpring .8s cubic-bezier(.34,1.56,.64,1) both;
  box-shadow:0 0 60px rgba(200,245,66,0.04),0 40px 80px rgba(0,0,0,0.5);
}
@keyframes cardSpring{
  0%{opacity:0;transform:translateY(60px) scale(0.88);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

/* ── LOGO ── */
.login-logo{
  width:72px;height:72px;border-radius:50%;
  background:rgba(200,245,66,0.1);
  border:2px solid rgba(200,245,66,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin:0 auto 20px;
  animation:logoBounce 1s cubic-bezier(.34,1.56,.64,1) .3s both;
  box-shadow:0 0 30px rgba(200,245,66,0.12);
}
@keyframes logoBounce{
  0%{opacity:0;transform:scale(0.3) rotate(-20deg);}
  70%{transform:scale(1.15) rotate(5deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);}
}
/* Pulse ring on logo */
.login-logo::after{
  content:'';position:absolute;
  width:72px;height:72px;border-radius:50%;
  border:2px solid rgba(200,245,66,0.2);
  animation:logoPulse 2.5s ease-out infinite;
}
@keyframes logoPulse{
  0%{transform:scale(1);opacity:0.6;}
  100%{transform:scale(1.7);opacity:0;}
}

/* ── TITLE ── */
.login-title{
  font-family:'Syne',sans-serif;font-size:30px;font-weight:800;
  color:#f0ede6;letter-spacing:-0.5px;margin-bottom:6px;
  animation:slideUp .7s cubic-bezier(.34,1.56,.64,1) .4s both;
}
.login-title em{color:#c8f542;font-style:normal;}
.login-sub{
  font-size:14px;color:#6b6b5a;margin-bottom:28px;font-family:'DM Sans',sans-serif;
  animation:slideUp .7s cubic-bezier(.34,1.56,.64,1) .5s both;
}
@keyframes slideUp{
  0%{opacity:0;transform:translateY(20px);}
  100%{opacity:1;transform:translateY(0);}
}

/* ── TABS ── */
.auth-tabs{
  display:flex;gap:0;background:#0d0d0b;
  border-radius:14px;padding:4px;margin-bottom:24px;
  animation:slideUp .7s cubic-bezier(.34,1.56,.64,1) .55s both;
  border:1px solid rgba(255,255,255,0.05);
}
.auth-tab{
  flex:1;padding:10px;border:none;border-radius:11px;
  font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;
  cursor:pointer;background:transparent;color:#6b6b5a;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.auth-tab.active{
  background:#c8f542;color:#080808;
  box-shadow:0 4px 16px rgba(200,245,66,0.3);
  transform:scale(1.02);
}
.auth-tab:not(.active):hover{color:#f0ede6;}

/* ── PANEL ANIMATION ── */
.auth-panel{display:none;}
.auth-panel.active{
  display:block;
  animation:panelIn .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes panelIn{
  0%{opacity:0;transform:translateY(16px) scale(0.97);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

/* ── FIELDS ── */
.field{text-align:left;margin-bottom:14px;}
.field label{
  display:block;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.1em;
  color:#6b6b5a;font-family:'DM Sans',sans-serif;margin-bottom:5px;
}
.field input{
  width:100%;padding:13px 16px;
  background:#161615;border:1.5px solid rgba(255,255,255,0.07);
  border-radius:12px;color:#f0ede6;font-size:14px;
  font-family:'DM Sans',sans-serif;outline:none;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.field input:focus{
  border-color:rgba(200,245,66,0.45);
  background:#1a1a18;
  box-shadow:0 0 0 3px rgba(200,245,66,0.08);
  transform:scale(1.01);
}
.field input::placeholder{color:#3a3a30;}

/* ── BUTTONS ── */
.action-btn{
  width:100%;padding:15px;border:none;border-radius:14px;
  font-size:15px;font-weight:800;font-family:'Syne',sans-serif;
  cursor:pointer;background:#c8f542;color:#080808;margin-top:4px;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 20px rgba(200,245,66,0.2);
}
.action-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 12px 36px rgba(200,245,66,0.35);
}
.action-btn:active{transform:scale(0.97);}
.action-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

.divider{
  display:flex;align-items:center;gap:10px;margin:18px 0;
  font-size:12px;color:#3a3a30;font-family:'DM Sans',sans-serif;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06);}

.google-btn{
  width:100%;padding:14px 20px;background:#1a1a18;color:#f0ede6;
  border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;
  font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.google-btn:hover{
  border-color:rgba(200,245,66,0.35);background:#1e1e1c;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.google-btn:active{transform:scale(0.97);}
.google-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.google-icon{width:18px;height:18px;flex-shrink:0;}

/* ── MSG ── */
#msg{
  font-size:13px;margin-top:12px;min-height:18px;
  font-family:'DM Sans',sans-serif;
  animation:msgPop .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes msgPop{0%{transform:scale(0.9);opacity:0;}100%{transform:scale(1);opacity:1;}}
#msg.err{color:#f04545;}
#msg.ok{color:#c8f542;}

.login-fine{font-size:11px;color:#3a3a30;margin-top:20px;font-family:'DM Sans',sans-serif;}

/* ── SUCCESS OVERLAY ── */
.success-overlay{
  position:fixed;inset:0;background:rgba(8,8,8,0.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;opacity:0;pointer-events:none;
  transition:opacity .4s;
}
.success-overlay.show{opacity:1;pointer-events:all;}
.success-checkmark{
  font-size:72px;
  animation:checkBounce .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes checkBounce{
  0%{transform:scale(0) rotate(-20deg);opacity:0;}
  70%{transform:scale(1.2) rotate(5deg);}
  100%{transform:scale(1) rotate(0deg);opacity:1;}
}
.success-text{
  font-family:'Syne',sans-serif;font-size:24px;font-weight:800;
  color:#c8f542;margin-top:16px;
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) .3s both;
}
.success-sub{
  font-size:14px;color:#6b6b5a;margin-top:8px;
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) .45s both;
}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo" style="position:relative;">⚡</div>
    <div class="login-title">Evolve<em>Fit</em></div>
    <p class="login-sub">Your elite fitness journey starts here</p>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- LOGIN PANEL -->
    <div class="auth-panel active" id="panel-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password"/>
      </div>
      <button class="action-btn" id="loginBtn" onclick="emailLogin()">Login →</button>
      <div class="divider">or</div>
      <button class="google-btn" id="googleLoginBtn" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- SIGNUP PANEL -->
    <div class="auth-panel" id="panel-signup">
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="signup-name" placeholder="e.g. Pavendan"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@email.com"/>
      </div>
      <div class="field">
        <label>Password (your choice)</label>
        <input type="password" id="signup-password" placeholder="Min 6 characters"/>
      </div>
      <button class="action-btn" id="signupBtn" onclick="emailSignup()">Create Account →</button>
      <div class="divider">or</div>
      <button class="google-btn" id="googleSignupBtn" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign up with Google
      </button>
    </div>

    <div id="msg"></div>
    <p class="login-fine">By continuing you agree to our Terms & Privacy Policy</p>
  </div>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-checkmark">⚡</div>
  <div class="success-text">Welcome to EvolveFit!</div>
  <div class="success-sub" id="successSubText">Loading your dashboard...</div>
</div>

<!-- Floating particles -->
<script>
for(let i=0;i<18;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'vw';
  p.style.width=p.style.height=(Math.random()*3+1)+'px';
  p.style.animationDuration=(Math.random()*12+8)+'s';
  p.style.animationDelay=-(Math.random()*12)+'s';
  p.style.opacity=Math.random()*0.5+0.1;
  document.getElementById('loginWrap').appendChild(p);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  updateProfile, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",
  authDomain: "evolvefit-07.firebaseapp.com",
  projectId: "evolvefit-07"
};
const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();

window.switchTab = function(tab) {
  document.querySelectorAll(".auth-tab").forEach((t,i)=>t.classList.toggle("active",(tab==="login"?i===0:i===1)));
  document.getElementById("panel-login").classList.toggle("active",tab==="login");
  document.getElementById("panel-signup").classList.toggle("active",tab==="signup");
  document.getElementById("msg").innerText="";
};

function showMsg(text,type="err"){
  const el=document.getElementById("msg");
  el.innerText=text;el.className=type;
  el.style.animation='none';el.offsetHeight;el.style.animation='';
}

function showSuccess(subText){
  document.getElementById("successSubText").innerText=subText||"Loading...";
  document.getElementById("successOverlay").classList.add("show");
}

// ✅ FIXED — returning users ALWAYS go through the daily check-in flow
// (result-bmi → calories → macros → graph) first. Premium status decides
// what happens AFTER graph.html, not before the flow even starts.
async function afterLogin(user){
  localStorage.setItem("username",user.displayName||user.email.split("@")[0]);
  localStorage.setItem("photo",user.photoURL||"");
  localStorage.setItem("uid",user.uid);
  try{
    const premSnap=await getDoc(doc(db,"premium",user.uid));
    if(premSnap.exists()&&premSnap.data().active===true){
      localStorage.setItem("premium","true");
      localStorage.setItem("ai_setup_done","true");
    }else{
      localStorage.setItem("premium","false");
    }
  }catch(e){console.error("Premium check failed:",e);}

  const setupDone=localStorage.getItem("setup_done")==="true";
  let dest,sub;
  if(!setupDone){
    dest="setup.html";sub="Setting up your profile...";
  } else {
    dest="result-bmi.html";sub="Let's check in...";
  }

  showSuccess(sub);
  setTimeout(()=>location.href=dest,1200);
}

window.googleLogin=function(){
  document.querySelectorAll(".google-btn").forEach(b=>b.disabled=true);
  signInWithPopup(auth,provider)
    .then(r=>afterLogin(r.user))
    .catch(()=>{
      showMsg("Google login failed. Try again.");
      document.querySelectorAll(".google-btn").forEach(b=>b.disabled=false);
    });
};

window.emailSignup=function(){
  const name=document.getElementById("signup-name").value.trim();
  const email=document.getElementById("signup-email").value.trim();
  const pass=document.getElementById("signup-password").value;
  if(!name){showMsg("Please enter your name.");return;}
  if(!email){showMsg("Please enter your email.");return;}
  if(pass.length<6){showMsg("Password must be at least 6 characters.");return;}
  const btn=document.getElementById("signupBtn");
  btn.disabled=true;btn.innerText="Creating account...";
  createUserWithEmailAndPassword(auth,email,pass)
    .then(r=>updateProfile(r.user,{displayName:name}).then(()=>afterLogin(r.user)))
    .catch(err=>{
      if(err.code==="auth/email-already-in-use")showMsg("Email already in use. Try logging in.");
      else if(err.code==="auth/invalid-email")showMsg("Invalid email address.");
      else showMsg("Signup failed: "+err.message);
      btn.disabled=false;btn.innerText="Create Account →";
    });
};

window.emailLogin=function(){
  const email=document.getElementById("login-email").value.trim();
  const pass=document.getElementById("login-password").value;
  if(!email){showMsg("Please enter your email.");return;}
  if(!pass){showMsg("Please enter your password.");return;}
  const btn=document.getElementById("loginBtn");
  btn.disabled=true;btn.innerText="Logging in...";
  signInWithEmailAndPassword(auth,email,pass)
    .then(r=>afterLogin(r.user))
    .catch(err=>{
      if(err.code==="auth/user-not-found")showMsg("No account found. Create one first.");
      else if(err.code==="auth/wrong-password")showMsg("Wrong password. Try again.");
      else if(err.code==="auth/invalid-email")showMsg("Invalid email address.");
      else showMsg("Login failed: "+err.message);
      btn.disabled=false;btn.innerText="Login →";
    });
};

onAuthStateChanged(auth,async(user)=>{if(user)await afterLogin(user);});
</script>
</body>
</html>
