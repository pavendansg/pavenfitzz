<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Your Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.setup-top{text-align:center;margin-bottom:24px}
.setup-username{font-size:14px;color:var(--accent);font-weight:600;margin-bottom:4px}
.setup-sub{font-size:13px;color:var(--muted);margin-top:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.goal-card{
  background:var(--glass);backdrop-filter:var(--glass-blur-sm);
  border:1.5px solid var(--glass-border);border-radius:var(--r-md);
  padding:14px 8px;text-align:center;cursor:pointer;transition:all .25s var(--spring);
}
.goal-card:hover{border-color:rgba(200,245,66,0.3);transform:translateY(-2px)}
.goal-card.selected{border-color:var(--accent);background:rgba(200,245,66,0.06);box-shadow:0 0 20px rgba(200,245,66,0.1)}
.goal-icon{font-size:22px;margin-bottom:6px}
.goal-name{font-size:12px;font-weight:700;color:var(--white);font-family:var(--font-display)}
.goal-sub{font-size:10px;color:var(--muted);margin-top:2px}
#errMsg{color:var(--red);font-size:12px;margin-top:10px;text-align:center;min-height:18px}
</style>
</head>
<body class="fade-in">
<div id="pageTransition" class="exit"></div>

<div class="container">
  <div class="card">
    <div class="setup-top">
      <div class="logo-wrap"><span style="font-size:24px">💪</span></div>
      <div class="setup-username" id="setupUser"></div>
      <h1>Tell us about you</h1>
      <p class="setup-sub">We'll build your exact plan from this</p>
      <div class="step-indicator">
        <div class="step-dot done"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>
    </div>

    <div class="slide-up stagger-1">
      <div class="two-col">
        <div><label class="input-label">Age</label><input type="number" id="age" placeholder="e.g. 22" min="10" max="80"/></div>
        <div><label class="input-label">Gender</label>
          <select id="gender"><option value="male">Male</option><option value="female">Female</option></select>
        </div>
      </div>
      <div class="two-col">
        <div><label class="input-label">Height (cm)</label><input type="number" id="height" placeholder="e.g. 175" min="100" max="250"/></div>
        <div><label class="input-label">Weight (kg)</label><input type="number" id="weight" placeholder="e.g. 70" min="30" max="250"/></div>
      </div>
      <div class="two-col">
        <div><label class="input-label">Target Weight (kg)</label><input type="number" id="target" placeholder="e.g. 80" min="30" max="250"/></div>
        <div><label class="input-label">Activity Level</label>
          <select id="activity">
            <option value="1.2">Sedentary</option>
            <option value="1.375">Light</option>
            <option value="1.55" selected>Moderate</option>
            <option value="1.725">Active</option>
            <option value="1.9">Very Active</option>
          </select>
        </div>
      </div>

      <label class="input-label">Your Goal</label>
      <div class="goal-grid">
        <div class="goal-card" onclick="selectGoal('bulk',this)"><div class="goal-icon">💪</div><div class="goal-name">Bulk</div><div class="goal-sub">Build muscle</div></div>
        <div class="goal-card" onclick="selectGoal('cut',this)"><div class="goal-icon">🔥</div><div class="goal-name">Cut</div><div class="goal-sub">Lose fat</div></div>
        <div class="goal-card" onclick="selectGoal('maintain',this)"><div class="goal-icon">⚖️</div><div class="goal-name">Maintain</div><div class="goal-sub">Stay lean</div></div>
      </div>

      <button class="primary-btn" id="mainBtn" onclick="saveSetup()" style="margin-top:20px">Calculate My Plan →</button>
      <div id="errMsg"></div>
    </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyDJ4_lODgzP-ZUxupjxRevtac2AN3Xm2MA",authDomain:"evolvefit-07.firebaseapp.com",projectId:"evolvefit-07"};
const app=initializeApp(cfg);
const auth=getAuth(app);
onAuthStateChanged(auth,u=>{if(!u)location.href="login.html";});
</script>
<script>
document.getElementById("setupUser").innerText="Hey, "+(localStorage.getItem("username")||"there")+" 👋";

let selectedGoal="";
function selectGoal(g,el){
  selectedGoal=g;
  document.querySelectorAll(".goal-card").forEach(c=>c.classList.remove("selected"));
  el.classList.add("selected");
}

function saveSetup(){
  const age=Number(document.getElementById("age").value);
  const gender=document.getElementById("gender").value;
  const height=Number(document.getElementById("height").value);
  const weight=Number(document.getElementById("weight").value);
  const target=Number(document.getElementById("target").value);
  const activity=Number(document.getElementById("activity").value);
  const err=document.getElementById("errMsg");

  if(!age||!height||!weight||!target){err.innerText="Please fill all fields ⚠️";return;}
  if(!selectedGoal){err.innerText="Pick your goal ⚠️";return;}
  err.innerText="";

  const h=height/100;
  const bmi=+(weight/(h*h)).toFixed(1);
  const bmr=gender==="male"?(10*weight)+(6.25*height)-(5*age)+5:(10*weight)+(6.25*height)-(5*age)-161;
  const tdee=Math.round(bmr*activity);
  let calories=selectedGoal==="bulk"?tdee+300:selectedGoal==="cut"?tdee-300:tdee;
  const protein=Math.round(selectedGoal==="bulk"?weight*2:selectedGoal==="cut"?weight*2.2:weight*1.8);
  const fats=Math.round(selectedGoal==="bulk"?weight*0.8:selectedGoal==="cut"?weight*0.6:weight*0.7);
  const carbs=Math.max(0,Math.round((calories-(protein*4)-(fats*9))/4));
  const idealMin=+(18.5*h*h).toFixed(1);
  const idealMax=+(24.9*h*h).toFixed(1);

  localStorage.setItem("age",age);
  localStorage.setItem("gender",gender);
  localStorage.setItem("height",height);
  localStorage.setItem("weight",weight);
  localStorage.setItem("targetWeight",target);
  localStorage.setItem("activity",activity);
  localStorage.setItem("goal",selectedGoal);
  localStorage.setItem("bmi",bmi);
  localStorage.setItem("calories",calories);
  localStorage.setItem("protein",protein);
  localStorage.setItem("fats",fats);
  localStorage.setItem("carbs",carbs);
  localStorage.setItem("idealMin",idealMin);
  localStorage.setItem("idealMax",idealMax);
  localStorage.setItem("bmr",Math.round(bmr));
  localStorage.setItem("tdee",tdee);
  localStorage.setItem("setup_done","true");
  localStorage.removeItem("calorie_done");
  localStorage.removeItem("bmi_done");
  localStorage.removeItem("macros_done");

  const t=document.getElementById("pageTransition");
  t.classList.add("enter");
  setTimeout(()=>{ location.href="result-bmi.html"; },480);
}
</script>
</body>
</html>
