<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EvolveFit — Calories</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
.result-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 70% 60% at 20% 30%,rgba(200,245,66,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(200,245,66,0.04) 0%,transparent 55%),#080808;}
.result-card{width:100%;max-width:480px;background:#111110;border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:36px 28px;animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.step-top{text-align:center;margin-bottom:24px}
.step-icon{font-size:32px;margin-bottom:10px}
.step-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#f0ede6;margin-bottom:4px}
.step-sub{font-size:12px;color:#6b6b5a;font-family:'DM Sans',sans-serif}
.prog-dots{display:flex;justify-content:center;gap:6px;margin-bottom:24px}
.prog-dot{width:32px;height:4px;border-radius:2px;background:rgba(255,255,255,0.08)}
.prog-dot.active{background:#c8f542}
.cal-big{background:rgba(200,245,66,0.06);border:1.5px solid rgba(200,245,66,0.2);border-radius:18px;padding:24px;text-align:center;margin-bottom:14px}
.cal-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#6b6b5a;margin-bottom:8px;font-family:'DM Sans',sans-serif}
.cal-val{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;color:#c8f542;line-height:1;margin-bottom:8px}
.cal-unit{font-size:18px;font-weight:400;color:#6b6b5a}
.cal-badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 16px;border-radius:50px;font-family:'DM Sans',sans-serif}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.info-box{background:#161615;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;text-align:center}
.info-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#6b6b5a;margin-bottom:4px;font-family:'DM Sans',sans-serif}
.info-val{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#f0ede6}
.bmr-row{background:#161615;border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:12px 14px;font-size:11px;color:#6b6b5a;font-family:'DM Sans',sans-serif;line-height:1.9;margin-bottom:14px}
.bmr-row span{color:#c8f542;font-weight:700}
.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.macro-box{background:#161615;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:13px;text-align:center}
.macro-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:3px}
.macro-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#6b6b5a;font-family:'DM Sans',sans-serif}
.next-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#c8f542;color:#080808;font-size:15px;font-weight:800;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(200,245,66,0.28)}
.back-btn{width:100%;padding:12px;border:1px solid rgba(255,255,255,0.06);border-radius:12px;background:transparent;color:#6b6b5a;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:all .2s}
.back-btn:hover{color:#f0ede6;border-color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<div class="result-wrap">
  <div class="result-card">
    <div class="step-top">
      <div class="step-icon">🔥</div>
      <div class="step-title">Your Calorie Target</div>
      <div class="step-sub">Step 2 of 3 — Daily Energy Needs</div>
    </div>
    <div class="prog-dots">
      <div class="prog-dot active"></div>
      <div class="prog-dot active"></div>
      <div class="prog-dot"></div>
    </div>

    <div class="cal-big">
      <div class="cal-label">Daily Target</div>
      <div class="cal-val" id="calVal">—<span class="cal-unit"> kcal</span></div>
      <div class="cal-badge" id="calBadge"></div>
    </div>

    <div class="info-grid">
      <div class="info-box"><div class="info-lbl">BMR</div><div class="info-val" id="bmrVal">—</div></div>
      <div class="info-box"><div class="info-lbl">TDEE</div><div class="info-val" id="tdeeVal">—</div></div>
      <div class="info-box"><div class="info-lbl">Goal</div><div class="info-val" id="goalVal">—</div></div>
    </div>

    <div class="bmr-row" id="bmrRow"></div>

    <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#6b6b5a;margin-bottom:8px;font-family:'DM Sans',sans-serif">Daily Macros</div>
    <div class="macro-grid">
      <div class="macro-box"><div class="macro-val" style="color:#f06464" id="protVal">—</div><div class="macro-lbl">Protein</div></div>
      <div class="macro-box"><div class="macro-val" style="color:#4592f0" id="carbVal">—</div><div class="macro-lbl">Carbs</div></div>
      <div class="macro-box"><div class="macro-val" style="color:#f0c040" id="fatVal">—</div><div class="macro-lbl">Fats</div></div>
    </div>

    <button class="next-btn" onclick="location.href='result-macros.html'">Next → Your Macros 🍗</button>
    <button class="back-btn" onclick="location.href='result-bmi.html'">← Back to BMI</button>
  </div>
</div>
<script>
if(!localStorage.getItem("setup_done")){location.href="setup.html";}
const cal=localStorage.getItem("calories")||"—";
const bmr=localStorage.getItem("bmr")||"—";
const tdee=localStorage.getItem("tdee")||"—";
const goal=localStorage.getItem("goal")||"maintain";
const protein=localStorage.getItem("protein")||"—";
const carbs=localStorage.getItem("carbs")||"—";
const fats=localStorage.getItem("fats")||"—";

document.getElementById("calVal").innerHTML=cal+`<span class="cal-unit"> kcal</span>`;
document.getElementById("bmrVal").innerText=bmr+" kcal";
document.getElementById("tdeeVal").innerText=tdee+" kcal";
document.getElementById("goalVal").innerText=goal.toUpperCase();
document.getElementById("protVal").innerText=protein+"g";
document.getElementById("carbVal").innerText=carbs+"g";
document.getElementById("fatVal").innerText=fats+"g";

const badges={bulk:{label:"+300 kcal surplus 💪",color:"#c8f542"},maintain:{label:"Maintenance ⚖️",color:"#f0c040"},cut:{label:"-300 kcal deficit 🔥",color:"#f06464"}};
const b=badges[goal]||badges.maintain;
const badge=document.getElementById("calBadge");
badge.innerText=b.label;
badge.style.background=b.color+"18";
badge.style.color=b.color;
badge.style.border="1px solid "+b.color+"40";

document.getElementById("bmrRow").innerHTML=`BMR: <span>${bmr} kcal</span> · TDEE: <span>${tdee} kcal</span> · Adjusted for your goal: <span>${cal} kcal</span>`;
</script>
</body>
</html>
